name: Update Three Institutions Data

on:
  schedule:
    # GitHub Actions 使用 UTC；台灣 15:01 = UTC 07:01
    # 週一～週五執行，台灣無日光節約時間。
    - cron: "1 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch TWSE three institutions data
        run: python cash.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No data change. Nothing to commit."
            exit 0
          fi

          git add cash.json

          if git diff --cached --quiet; then
            echo "No data change. Nothing to commit."
            exit 0
          fi
          
          git commit -m "Update cash"
          git push
