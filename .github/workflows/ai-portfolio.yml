name: AI Trading Portfolio

on:

  # ========================================================
  # 台灣時間交易日盤中
  #
  # GitHub Actions 使用 UTC
  # 台灣 UTC+8
  #
  # 09:00 ~ 13:30 台灣時間
  # = 01:00 ~ 05:30 UTC
  #
  # 每 5 分鐘檢查一次
  # ========================================================

  schedule:

    - cron: "*/5 1-5 * * 1-5"


  # 可以手動執行

  workflow_dispatch:


permissions:

  contents: write


jobs:

  update-portfolio:

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ======================================================
      # 3. 安裝套件
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests


      # ======================================================
      # 4. 執行 Portfolio
      # ======================================================

      - name: Update AI Portfolio

        run: |

          python ai_portfolio.py


      # ======================================================
      # 5. Commit JSON
      # ======================================================

      - name: Commit portfolio data

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add ai_portfolio.json


          if git diff --cached --quiet; then

            echo "沒有資料變更"

          else

            git commit -m "Update AI portfolio"

            git push

          fi
