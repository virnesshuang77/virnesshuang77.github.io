name: AI Trading - Taiwan Top 100

on:
  # 台灣時間每個交易日 16:10 執行
  # GitHub Actions 使用 UTC
  # 台灣 UTC+8，所以 16:10 台灣時間 = 08:10 UTC
  schedule:
    - cron: "10 8 * * 1-5"

  # 可以在 GitHub Actions 頁面手動執行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-taiwan-top100:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 1. 取得 repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. 安裝 Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # 3. 安裝 Python 套件
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ------------------------------------------------------
      # 4. 執行台股 Top 100 資料抓取
      # ------------------------------------------------------
      - name: Run Taiwan Top 100
        run: |
          python aitrading.py

      # ------------------------------------------------------
      # 5. 檢查 JSON 是否產生
      # ------------------------------------------------------
      - name: Verify output
        run: |
          test -f tw_top100.json
          python - <<'PY'
          import json

          with open("tw_top100.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          stocks = data.get("stocks", [])

          print("交易日:", data.get("date"))
          print("股票數量:", len(stocks))
          print()

          print("前 10 名：")

          for stock in stocks[:10]:
              print(
                  stock["rank"],
                  stock["symbol"],
                  stock["name"],
                  stock["market"],
                  stock["trading_value"]
              )

          if len(stocks) != 100:
              raise SystemExit(
                  f"錯誤：Top 100 實際只有 {len(stocks)} 檔"
              )
          PY

      # ------------------------------------------------------
      # 6. 將新的 JSON 寫回 GitHub repository
      # ------------------------------------------------------
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tw_top100.json

          if git diff --cached --quiet; then
            echo "沒有資料變更，不需要 commit。"
          else
            git commit -m "Update Taiwan AI trading Top 100"
            git push
          fi
