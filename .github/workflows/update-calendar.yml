name: Update Calendar Data

on:
  schedule:
    # 每天台灣時間 06:00 執行
    # GitHub Actions 使用 UTC，所以台灣 06:00 = UTC 22:00（前一天）
    - cron: "0 22 * * *"

  # 允許你在 GitHub Actions 頁面手動執行
  workflow_dispatch:

jobs:

  update-calendar:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # =================================================
      # 取得 Repository
      # =================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # =================================================
      # 安裝 Python
      # =================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # =================================================
      # 安裝 requests
      # =================================================

      - name: Install dependencies

        run: |
          python -m pip install --upgrade pip
          pip install requests


      # =================================================
      # 執行 update_calendar.py
      # =================================================

      - name: Update calendar data

        run: |
          python update_calendar.py


      # =================================================
      # 將新的 calendar-data.json 寫回 GitHub
      # =================================================

      - name: Commit updated calendar data

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendar-data.json

          git diff --cached --quiet || git commit -m "Update calendar data"

          git push
