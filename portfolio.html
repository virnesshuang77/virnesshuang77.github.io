<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Trading Portfolio</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7fa;
    color: #111827;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
    line-height: 1.6;
}
const PORTFOLIO_URL = "ai_portfolio.json";


/* =========================================================
   初始資金
========================================================= */

const DEFAULT_CAPITAL = 1000000;


/* =========================================================
   工具
========================================================= */

function number(value, fallback = 0) {

    const n = Number(value);

    return Number.isFinite(n)
        ? n
        : fallback;

}


function formatMoney(value) {

    return "$" + number(value).toLocaleString(
        "zh-TW",
        {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        }
    );

}


function formatPrice(value) {

    return number(value).toLocaleString(
        "zh-TW",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}


function formatPercent(value) {

    const n = number(value);

    if (n > 0) {
        return "+" + n.toFixed(2) + "%";
    }

    if (n < 0) {
        return n.toFixed(2) + "%";
    }

    return "0.00%";

}


function profitClass(value) {

    const n = number(value);

    if (n > 0) {
        return "profit";
    }

    if (n < 0) {
        return "loss";
    }

    return "flat";

}


/* =========================================================
   目前持有
========================================================= */

function renderHoldings(holdings) {

    const container =
        document.getElementById("holdings");


    if (
        !Array.isArray(holdings) ||
        holdings.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <strong>
                    目前沒有持有股票
                </strong>

                

            </div>

        `;

        return;
    }


    container.innerHTML =
        holdings.map((stock, index) => {

            const quantity =
                number(stock.quantity);

            const cost =
                number(stock.average_cost);

            const currentPrice =
                number(stock.current_price);

            const marketValue =
                quantity * currentPrice;

            const costValue =
                quantity * cost;

            const profit =
                marketValue - costValue;

            const returnRate =
                costValue > 0
                    ? profit / costValue * 100
                    : 0;


            return `

                <div class="holding">

                    <div class="holding-rank">
                        #${index + 1}
                    </div>

                    <div class="holding-symbol">
                        ${escapeHTML(stock.symbol)}
                    </div>

                    <div class="holding-name">
                        ${escapeHTML(stock.name)}
                    </div>

                    <div class="holding-number">

                        <span class="holding-label">
                            持有股數
                        </span>

                        <span class="holding-value">
                            ${quantity.toLocaleString("zh-TW")}
                        </span>

                    </div>

                    <div class="holding-number">

                        <span class="holding-label">
                            平均成本
                        </span>

                        <span class="holding-value">
                            ${formatPrice(cost)}
                        </span>

                    </div>

                    <div class="holding-number">

                        <span class="holding-label">
                            目前損益
                        </span>

                        <span class="holding-value ${profitClass(returnRate)}">
                            ${formatPercent(returnRate)}
                        </span>

                    </div>

                </div>

            `;

        }).join("");

}
/* =========================================================
   交易紀錄
========================================================= */

function renderTransactions(transactions) {

    const tbody =
        document.getElementById("transactions");


    if (
        !Array.isArray(transactions) ||
        transactions.length === 0
    ) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    style="text-align:center;color:#64748b;padding:35px;"
                >

                    尚無交易紀錄

                </td>

            </tr>

        `;

        return;
    }


    tbody.innerHTML =
        transactions.map(transaction => {

            const action =
                transaction.action || "";

            let actionClass = "";

            if (action === "買入") {
                actionClass = "action-buy";
            }

            else if (action === "加碼") {
                actionClass = "action-add";
            }

            else if (action === "減碼") {
                actionClass = "action-reduce";
            }

            else if (action === "賣出") {
                actionClass = "action-sell";
            }


            return `

                <tr>

                    <td>
                        ${escapeHTML(transaction.date)}
                    </td>

                    <td>

                        <strong>
                            ${escapeHTML(transaction.symbol)}
                        </strong>

                        <br>

                        ${escapeHTML(transaction.name)}

                    </td>

                    <td class="${actionClass}">
                        ${escapeHTML(action)}
                    </td>

                    <td>
                        ${formatPrice(transaction.price)}
                    </td>

                    <td>
                        ${escapeHTML(
                            transaction.allocation || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            transaction.reason || "-"
                        )}
                    </td>

                </tr>

            `;

        }).join("");

}


/* =========================================================
   每日績效
========================================================= */

function renderPerformance(performance) {

    const container =
        document.getElementById("performance");


    if (
        !Array.isArray(performance) ||
        performance.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <strong>
                    尚無每日績效資料
                </strong>

                第一筆交易或每日資產紀錄產生後，
                會從這裡開始累積。

            </div>

        `;

        return;
    }


    const sorted =
        [...performance].sort(
            (a, b) =>
                String(b.date)
                    .localeCompare(
                        String(a.date)
                    )
        );


    container.innerHTML =
        sorted.map(row => {

            const returnRate =
                number(row.return_percent);


            return `

                <div class="performance-row">

                    <div class="performance-date">
                        ${escapeHTML(row.date)}
                    </div>

                    <div class="performance-assets">
                        ${formatMoney(row.total_assets)}
                    </div>

                    <div
                        class="performance-return ${profitClass(returnRate)}"
                    >
                        ${formatPercent(returnRate)}
                    </div>

                </div>

            `;

        }).join("");

}


/* =========================================================
   HTML Escape
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   主程式
========================================================= */

async function loadPortfolio() {

    try {

        const response =
            await fetch(
                PORTFOLIO_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "ai_portfolio.json 尚未建立"
            );

        }


        const data =
            await response.json();


        /* =================================================
           基本資料
        ================================================= */

        const initialCapital =
            number(
                data.initial_capital,
                DEFAULT_CAPITAL
            );


        const totalAssets =
            number(
                data.total_assets,
                initialCapital
            );


        const totalProfit =
            totalAssets -
            initialCapital;


        const totalReturn =
            initialCapital > 0
                ? totalProfit /
                  initialCapital *
                  100
                : 0;


        /* =================================================
           Summary
        ================================================= */

        document.getElementById(
            "initialCapital"
        ).textContent =
            formatMoney(initialCapital);


        document.getElementById(
            "totalAssets"
        ).textContent =
            formatMoney(totalAssets);


        const profitElement =
            document.getElementById(
                "totalProfit"
            );


        profitElement.textContent =
            (totalProfit >= 0 ? "+" : "") +
            formatMoney(
                Math.abs(totalProfit)
            );


        profitElement.className =
            "summary-value " +
            profitClass(totalProfit);


        const returnElement =
            document.getElementById(
                "totalReturn"
            );


        returnElement.textContent =
            formatPercent(totalReturn);


        returnElement.className =
            "summary-value " +
            profitClass(totalReturn);


        /* =================================================
           日期
        ================================================= */

        document.getElementById(
            "dataDate"
        ).textContent =
            data.date || "—";


        document.getElementById(
            "updatedAt"
        ).textContent =
            data.updated_at || "—";


        /* =================================================
           各區塊
        ================================================= */

        renderHoldings(
            data.holdings || []
        );
renderTransactions(
            data.transactions || []
        );


        renderPerformance(
            data.performance || []
        );


    }

    catch (error) {

        console.error(error);


        document.getElementById(
            "holdings"
        ).innerHTML = `

            <div class="error">

                <strong>
                    尚未建立 AI Portfolio 資料
                </strong>

                <br><br>

                ${escapeHTML(error.message)}

                <br><br>

                等交易資料建立後，
                本頁會自動顯示持股與累積績效。

            </div>

        `;
document.getElementById(
            "performance"
        ).innerHTML = "";

    }

}


/* =========================================================
   啟動
========================================================= */

loadPortfolio();

</script>

</body>
</html>
