<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Trading Portfolio</title>
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Trading Portfolio</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7fa;
    color: #111827;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
    line-height: 1.6;
}

/* ===== Portfolio layout ===== */

.site-header {
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    padding: 28px 24px;
}

.site-header h1 {
    margin: 0;
    font-size: 28px;
}

.site-header p {
    margin: 4px 0 0;
    color: #64748b;
}

.container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px;
}

.summary-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
}

.summary-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 20px;
}

.summary-label {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 6px;
}

.summary-value {
    font-size: 26px;
    font-weight: 700;
}

.meta {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin: 16px 0 28px;
    color: #64748b;
    font-size: 14px;
}

.section {
    margin-top: 28px;
}

.section-title {
    margin: 0 0 12px;
    font-size: 20px;
}

.holding {
    display: grid;
    grid-template-columns: 60px 90px minmax(100px, 1fr) repeat(3, minmax(110px, 150px));
    align-items: center;
    gap: 14px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
}

.holding-rank {
    color: #64748b;
    font-weight: 700;
}

.holding-symbol {
    font-weight: 800;
}

.holding-name {
    font-weight: 700;
}

.holding-number {
    text-align: right;
}

.holding-label {
    display: block;
    color: #64748b;
    font-size: 13px;
}

.holding-value {
    font-weight: 700;
}

.table-wrap {
    overflow-x: auto;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px 14px;
    border-bottom: 1px solid #eef2f7;
    text-align: left;
    white-space: nowrap;
}

th {
    background: #f8fafc;
    color: #475569;
    font-size: 13px;
}

.action-buy {
    font-weight: 700;
}

.action-add {
    font-weight: 700;
}

.action-reduce {
    font-weight: 700;
}

.action-sell {
    font-weight: 800;
}

.profit {
    color: #16a34a;
}

.loss {
    color: #dc2626;
}

.flat {
    color: #64748b;
}

.performance-row {
    display: grid;
    grid-template-columns: 1fr 1fr 160px;
    gap: 16px;
    align-items: center;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 8px;
}

.performance-assets {
    font-weight: 700;
}

.performance-return {
    text-align: right;
    font-weight: 700;
}

.empty,
.error {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 28px;
    text-align: center;
}

.rules {
    margin: 28px 0 40px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 20px;
}

.rule {
    padding: 8px 0;
    border-bottom: 1px solid #eef2f7;
}

.rule:last-child {
    border-bottom: 0;
}

@media (max-width: 900px) {
    .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .holding {
        grid-template-columns: 50px 80px minmax(100px, 1fr);
    }

    .holding-number {
        text-align: left;
    }

    .meta {
        flex-direction: column;
    }
}

@media (max-width: 600px) {
    .container {
        padding: 16px;
    }

    .summary-grid {
        grid-template-columns: 1fr;
    }

    .site-header {
        padding: 22px 16px;
    }

    .site-header h1 {
        font-size: 23px;
    }

    .holding {
        grid-template-columns: 1fr 1fr;
    }

    .holding-name {
        grid-column: 1 / -1;
    }

    .performance-row {
        grid-template-columns: 1fr;
    }

    .performance-return {
        text-align: left;
    }
}

.navbar {
    width: 100%;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    overflow-x: auto;
}

.navlink {
    flex: 0 0 auto;
    color: #475569;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    white-space: nowrap;
}

.navlink:hover {
    background: #f1f5f9;
}

.navlink.active {
    background: #e2e8f0;
    color: #111827;
}

</style>


<body>

<header class="site-header">
    <div>
        <h1>🤖 AI Trading Portfolio</h1>
        <p>AI 自動交易模擬投資組合</p>
    </div>
</header>


<nav class="navbar">
    <a class="navlink" href="index.html">融資融券維持率</a>
    <a class="navlink" href="calendar.html">每日行事曆</a>
    <a class="navlink active" href="portfolio.html">投資績效名片</a>
    <a class="navlink" href="foreign.html">外資買賣超</a>
    <a class="navlink" href="broker.html">投信買賣超</a>
    <a class="navlink" href="credit.html">融資融券變化</a>
    <a class="navlink" href="foreign-cash.html">三大法人買賣超</a>
</nav>

<main class="container">

    <section class="summary-grid">
        <div class="summary-card">
            <div class="summary-label">初始資金</div>
            <div class="summary-value" id="initialCapital">—</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">目前總資產</div>
            <div class="summary-value" id="totalAssets">—</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">累積損益</div>
            <div class="summary-value" id="totalProfit">—</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">累積報酬率</div>
            <div class="summary-value" id="totalReturn">—</div>
        </div>
    </section>

    <section class="meta">
        <span>資料日期：<strong id="dataDate">—</strong></span>
        <span>更新時間：<strong id="updatedAt">—</strong></span>
    </section>

    <section class="section">
        <h2 class="section-title">📊 目前持有</h2>
        <div id="holdings"></div>
    </section>

    <section class="section">
        <h2 class="section-title">🧾 交易紀錄</h2>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>標的</th>
                        <th>動作</th>
                        <th>價格</th>
                        <th>配置</th>
                        <th>原因</th>
                    </tr>
                </thead>
                <tbody id="transactions"></tbody>
            </table>
        </div>
    </section>

    <section class="section">
        <h2 class="section-title">📈 每日績效</h2>
        <div id="performance"></div>
    </section>

    <section class="rules">
        <h2 class="section-title">⚙️ 交易規則</h2>
        <div class="rule">
            <strong>① 單一標的最大配置：</strong>20%
        </div>
        <div class="rule">
            <strong>② 首次買入：</strong>AI 選股當日不視為已買入，必須等下一個交易日才執行交易。
        </div>
        <div class="rule">
            <strong>③ 停利：</strong>持有股票達到 <strong>+10%</strong> 報酬率時，全部賣出。
        </div>
        <div class="rule">
            <strong>④ 持股上限：</strong>5 檔
        </div>
    </section>

</main>

<script>
const PORTFOLIO_URL = "ai_portfolio.json";


/* =========================================================
   初始資金
========================================================= */

const DEFAULT_CAPITAL = 1000000;


/* =========================================================
   工具
========================================================= */

function number(value, fallback = 0) {

    const n = Number(value);

    return Number.isFinite(n)
        ? n
        : fallback;

}


function formatMoney(value) {

    return "$" + number(value).toLocaleString(
        "zh-TW",
        {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        }
    );

}


function formatPrice(value) {

    return number(value).toLocaleString(
        "zh-TW",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}


function formatPercent(value) {

    const n = number(value);

    if (n > 0) {
        return "+" + n.toFixed(2) + "%";
    }

    if (n < 0) {
        return n.toFixed(2) + "%";
    }

    return "0.00%";

}


function profitClass(value) {

    const n = number(value);

    if (n > 0) {
        return "profit";
    }

    if (n < 0) {
        return "loss";
    }

    return "flat";

}


/* =========================================================
   目前持有
========================================================= */

function renderHoldings(holdings) {

    const container =
        document.getElementById("holdings");


    if (
        !Array.isArray(holdings) ||
        holdings.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <strong>
                    目前沒有持有股票
                </strong>

                

            </div>

        `;

        return;
    }


    container.innerHTML =
        holdings.map((stock, index) => {

            const quantity =
                number(stock.quantity);

            const cost =
                number(stock.average_cost);

            const currentPrice =
                number(stock.current_price);

            const marketValue =
                quantity * currentPrice;

            const costValue =
                quantity * cost;

            const profit =
                marketValue - costValue;

            const returnRate =
                costValue > 0
                    ? profit / costValue * 100
                    : 0;


            return `

                <div class="holding">

                    <div class="holding-rank">
                        #${index + 1}
                    </div>

                    <div class="holding-symbol">
                        ${escapeHTML(stock.symbol)}
                    </div>

                    <div class="holding-name">
                        ${escapeHTML(stock.name)}
                    </div>

                    <div class="holding-number">

                        <span class="holding-label">
                            持有股數
                        </span>

                        <span class="holding-value">
                            ${quantity.toLocaleString("zh-TW")}
                        </span>

                    </div>

                    <div class="holding-number">

                        <span class="holding-label">
                            平均成本
                        </span>

                        <span class="holding-value">
                            ${formatPrice(cost)}
                        </span>

                    </div>

                    <div class="holding-number">

                        <span class="holding-label">
                            目前損益
                        </span>

                        <span class="holding-value ${profitClass(returnRate)}">
                            ${formatPercent(returnRate)}
                        </span>

                    </div>

                </div>

            `;

        }).join("");

}
/* =========================================================
   交易紀錄
========================================================= */

function renderTransactions(transactions) {

    const tbody =
        document.getElementById("transactions");


    if (
        !Array.isArray(transactions) ||
        transactions.length === 0
    ) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    style="text-align:center;color:#64748b;padding:35px;"
                >

                    尚無交易紀錄

                </td>

            </tr>

        `;

        return;
    }


    tbody.innerHTML =
        transactions.map(transaction => {

            const action =
                transaction.action || "";

            let actionClass = "";

            if (action === "買入") {
                actionClass = "action-buy";
            }

            else if (action === "加碼") {
                actionClass = "action-add";
            }

            else if (action === "減碼") {
                actionClass = "action-reduce";
            }

            else if (action === "賣出") {
                actionClass = "action-sell";
            }


            return `

                <tr>

                    <td>
                        ${escapeHTML(transaction.date)}
                    </td>

                    <td>

                        <strong>
                            ${escapeHTML(transaction.symbol)}
                        </strong>

                        <br>

                        ${escapeHTML(transaction.name)}

                    </td>

                    <td class="${actionClass}">
                        ${escapeHTML(action)}
                    </td>

                    <td>
                        ${formatPrice(transaction.price)}
                    </td>

                    <td>
                        ${escapeHTML(
                            transaction.allocation || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            transaction.reason || "-"
                        )}
                    </td>

                </tr>

            `;

        }).join("");

}


/* =========================================================
   每日績效
========================================================= */

function renderPerformance(performance) {

    const container =
        document.getElementById("performance");


    if (
        !Array.isArray(performance) ||
        performance.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <strong>
                    尚無每日績效資料
                </strong>

                第一筆交易或每日資產紀錄產生後，
                會從這裡開始累積。

            </div>

        `;

        return;
    }


    const sorted =
        [...performance].sort(
            (a, b) =>
                String(b.date)
                    .localeCompare(
                        String(a.date)
                    )
        );


    container.innerHTML =
        sorted.map(row => {

            const returnRate =
                number(row.return_percent);


            return `

                <div class="performance-row">

                    <div class="performance-date">
                        ${escapeHTML(row.date)}
                    </div>

                    <div class="performance-assets">
                        ${formatMoney(row.total_assets)}
                    </div>

                    <div
                        class="performance-return ${profitClass(returnRate)}"
                    >
                        ${formatPercent(returnRate)}
                    </div>

                </div>

            `;

        }).join("");

}


/* =========================================================
   HTML Escape
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   主程式
========================================================= */

async function loadPortfolio() {

    try {

        const response =
            await fetch(
                PORTFOLIO_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "ai_portfolio.json 尚未建立"
            );

        }


        const data =
            await response.json();


        /* =================================================
           基本資料
        ================================================= */

        const initialCapital =
            number(
                data.initial_capital,
                DEFAULT_CAPITAL
            );


        const totalAssets =
            number(
                data.total_assets,
                initialCapital
            );


        const totalProfit =
            totalAssets -
            initialCapital;


        const totalReturn =
            initialCapital > 0
                ? totalProfit /
                  initialCapital *
                  100
                : 0;


        /* =================================================
           Summary
        ================================================= */

        document.getElementById(
            "initialCapital"
        ).textContent =
            formatMoney(initialCapital);


        document.getElementById(
            "totalAssets"
        ).textContent =
            formatMoney(totalAssets);


        const profitElement =
            document.getElementById(
                "totalProfit"
            );


        profitElement.textContent =
            (totalProfit >= 0 ? "+" : "") +
            formatMoney(
                Math.abs(totalProfit)
            );


        profitElement.className =
            "summary-value " +
            profitClass(totalProfit);


        const returnElement =
            document.getElementById(
                "totalReturn"
            );


        returnElement.textContent =
            formatPercent(totalReturn);


        returnElement.className =
            "summary-value " +
            profitClass(totalReturn);


        /* =================================================
           日期
        ================================================= */

        document.getElementById(
            "dataDate"
        ).textContent =
            data.date || "—";


        document.getElementById(
            "updatedAt"
        ).textContent =
            data.updated_at || "—";


        /* =================================================
           各區塊
        ================================================= */

        renderHoldings(
            data.holdings || []
        );
renderTransactions(
            data.transactions || []
        );


        renderPerformance(
            data.performance || []
        );


    }

    catch (error) {

        console.error(error);


        document.getElementById(
            "holdings"
        ).innerHTML = `

            <div class="error">

                <strong>
                    尚未建立 AI Portfolio 資料
                </strong>

                <br><br>

                ${escapeHTML(error.message)}

                <br><br>

                等交易資料建立後，
                本頁會自動顯示持股與累積績效。

            </div>

        `;
document.getElementById(
            "performance"
        ).innerHTML = "";

    }

}


/* =========================================================
   啟動
========================================================= */

loadPortfolio();
</script>
</body>
</html>
