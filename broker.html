<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>投信買賣超</title>

<style>

/* =========================================================
   基本設定
========================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

    background: #f5f7fa;

    color: #222;

}


.wrap {

    max-width: 1200px;

    margin: 0 auto;

    padding:
        24px
        20px
        50px;

}


/* =========================================================
   Header
========================================================= */

.top {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 14px;

    margin-bottom: 28px;

    flex-wrap: wrap;

}


.brand {

    font-size: 23px;

    font-weight: 900;

    white-space: nowrap;

}


.actions {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

}


.nav-btn {

    display: inline-block;

    text-decoration: none;

    border:
        1px solid
        #d5dee8;

    background: #fff;

    color: #18222c;

    border-radius: 9px;

    padding:
        9px
        13px;

    font-weight: 800;

    cursor: pointer;

    transition: 0.15s;

    white-space: nowrap;

}


.nav-btn:hover {

    background: #f3f6f9;

}


.nav-btn.active {

    background: #222;

    color: #fff;

    border-color: #222;

}


/* =========================================================
   標題
========================================================= */

h1 {

    margin:
        0
        0
        5px;

    font-size: 32px;

}


.date {

    color: #777;

    margin-bottom: 25px;

}


/* =========================================================
   搜尋區
========================================================= */

.search-area {

    background: white;

    padding: 22px;

    border-radius: 14px;

    box-shadow:
        0
        4px
        14px
        rgba(0,0,0,0.05);

    margin-bottom: 20px;

}


.search-title {

    font-size: 17px;

    font-weight: bold;

    margin-bottom: 10px;

}


.search-row {

    display: flex;

    gap: 10px;

}


.search-row input {

    flex: 1;

    padding: 14px;

    border:
        1px
        solid
        #ddd;

    border-radius: 8px;

    font-size: 16px;

    min-width: 0;

}


.search-row input:focus {

    outline: none;

    border-color: #222;

}


.search-row button {

    padding:
        13px
        25px;

    border: none;

    border-radius: 8px;

    background: #222;

    color: white;

    cursor: pointer;

    font-weight: 700;

}


.search-row button:hover {

    background: #111;

}


.status {

    margin-top: 10px;

    color: #777;

    font-size: 14px;

}


/* =========================================================
   排序控制
========================================================= */

.controls {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 20px;

    flex-wrap: wrap;

}


.tabs {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

}


.tab {

    border:
        1px
        solid
        #ddd;

    background: white;

    padding:
        10px
        16px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 14px;

    transition: 0.15s;

}


.tab:hover {

    background: #f3f6f9;

}


.tab.active {

    background: #222;

    color: white;

    border-color: #222;

}


.limit-select {

    padding:
        10px
        14px;

    border:
        1px
        solid
        #ddd;

    border-radius: 8px;

    background: white;

    font-size: 14px;

}


/* =========================================================
   資料說明
========================================================= */

.info-box {

    background: white;

    border-radius: 14px;

    padding:
        14px
        18px;

    margin-bottom: 20px;

    color: #666;

    font-size: 14px;

    box-shadow:
        0
        4px
        14px
        rgba(0,0,0,0.04);

}


.info-box strong {

    color: #222;

}


/* =========================================================
   表格
========================================================= */

.table-wrapper {

    background: white;

    border-radius: 14px;

    overflow-x: auto;

    box-shadow:
        0
        4px
        14px
        rgba(0,0,0,0.05);

}


table {

    width: 100%;

    border-collapse:
        collapse;

    min-width: 900px;

}


th {

    background: #f0f2f5;

    padding: 14px;

    text-align: right;

    font-weight: 800;

    white-space: nowrap;

}


th:first-child,
th:nth-child(2),
th:nth-child(3) {

    text-align: left;

}


td {

    padding:
        13px
        14px;

    border-top:
        1px
        solid
        #eee;

    text-align: right;

    white-space: nowrap;

}


td:first-child,
td:nth-child(2),
td:nth-child(3) {

    text-align: left;

}


tr:hover {

    background: #fafafa;

}


.rank {

    font-weight: 800;

    color: #777;

}


.stock-id {

    font-family:
        monospace;

    color: #666;

}


.positive {

    color: #d32f2f;

    font-weight: bold;

}


.negative {

    color: #16803c;

    font-weight: bold;

}


.message {

    text-align:
        center !important;

    padding:
        45px !important;

    color: #777;

}


.error-message {

    color: #c62828;

    font-weight: bold;

}


/* =========================================================
   手機版
========================================================= */

@media (max-width: 850px) {

    .wrap {

        padding:
            18px
            12px
            40px;

    }


    .top {

        align-items:
            flex-start;

        margin-bottom: 22px;

    }


    .brand {

        width: 100%;

    }


    .actions {

        width: 100%;

    }


    .nav-btn {

        flex: 1;

        text-align: center;

    }


    h1 {

        font-size: 28px;

    }


    .search-row {

        flex-direction:
            column;

    }


    .search-row button {

        width: 100%;

    }


    .tabs {

        width: 100%;

    }


    .tab {

        flex: 1;

        min-width: 90px;

    }


    .limit-select {

        width: 100%;

    }

}

</style>

</head>


<body>


<div class="wrap">


<!-- =====================================================
     Header
===================================================== -->

<header class="top">

    <div class="brand">
        📈 投資績效名片
    </div>


    <div class="actions">

        <a
            class="nav-btn"
            href="index.html"
        >
            📊 融資融券維持率
        </a>


        <a
            class="nav-btn"
            href="foreign.html"
        >
            🏦 法人買賣超
        </a>


        <a
            class="nav-btn active"
            href="broker.html"
        >
            🏢 投信買賣超
        </a>

    </div>

</header>


<!-- =====================================================
     標題
===================================================== -->

<h1>
    🏢 投信買賣超
</h1>


<div
    class="date"
    id="dataDate"
>
    資料載入中...
</div>


<!-- =====================================================
     搜尋
===================================================== -->

<div class="search-area">


    <div class="search-title">
        搜尋股票
    </div>


    <div class="search-row">


        <input
            id="searchInput"
            type="text"
            placeholder="輸入股票代號或名稱，例如：2330、台積電"
        >


        <button
            id="searchButton"
        >
            搜尋
        </button>


    </div>


    <div
        class="status"
        id="searchStatus"
    >
        正在讀取投信資料...
    </div>


</div>


<!-- =====================================================
     說明
===================================================== -->

<div class="info-box">

    <strong>資料說明：</strong>

    本頁顯示投信每日買賣超排行。

    <br>

    買賣超數量單位：
    <strong>張</strong>

    ；金額單位：
    <strong>元</strong>。

</div>


<!-- =====================================================
     排序
===================================================== -->

<div class="controls">


    <div class="tabs">


        <button
            class="tab active"
            data-type="buy"
        >
            買超
        </button>


        <button
            class="tab"
            data-type="sell"
        >
            賣超
        </button>


        <button
            class="tab"
            data-type="net_money"
        >
            淨買超金額
        </button>


        <button
            class="tab"
            data-type="all"
        >
            全部
        </button>


    </div>


    <select
        id="limitSelect"
        class="limit-select"
    >

        <option value="10">
            TOP 10
        </option>


        <option value="20">
            TOP 20
        </option>


        <option value="50">
            TOP 50
        </option>


        <option value="100">
            TOP 100
        </option>


    </select>


</div>


<!-- =====================================================
     表格
===================================================== -->

<div class="table-wrapper">


<table>


<thead>

<tr>

    <th>
        Rank
    </th>


    <th>
        股票代號
    </th>


    <th>
        股票名稱
    </th>


    <th>
        投信買賣超
    </th>


    <th>
        淨買超金額
    </th>

</tr>

</thead>


<tbody
    id="tableBody"
>
</tbody>


</table>


</div>


</div>


<script>


// ========================================================
// 全域變數
// ========================================================

let moneyData = null;

let currentType = "buy";

let currentRows = [];


// ========================================================
// 數字格式
// ========================================================

function formatNumber(value) {

    const n =
        Number(value);


    if (
        !Number.isFinite(n)
    ) {

        return "-";

    }


    return n.toLocaleString(
        "zh-TW"
    );

}


// ========================================================
// 金額格式
// ========================================================

function formatMoney(value) {

    const n =
        Number(value);


    if (
        !Number.isFinite(n)
    ) {

        return "-";

    }


    return n.toLocaleString(
        "zh-TW"
    );

}


// ========================================================
// 把股數轉成張
//
// TWSE 原始資料通常是「股」。
// 1 張 = 1,000 股。
// ========================================================

function sharesToLots(value) {

    const n =
        Number(value);


    if (
        !Number.isFinite(n)
    ) {

        return "-";

    }


    return (
        n / 1000
    ).toLocaleString(
        "zh-TW",
        {
            maximumFractionDigits: 2
        }
    );

}


// ========================================================
// 取得投信排行資料
// ========================================================

function getInvestmentTrustData() {


    if (
        !moneyData
    ) {

        return [];

    }


    // money_rank.json 原本的欄位
    // 是 investment_trust

    if (
        Array.isArray(
            moneyData.investment_trust
        )
    ) {

        return [
            ...moneyData.investment_trust
        ];

    }


    // 萬一未來 JSON 改成 investmentTrust

    if (
        Array.isArray(
            moneyData.investmentTrust
        )
    ) {

        return [
            ...moneyData.investmentTrust
        ];

    }


    return [];

}


// ========================================================
// 取得淨買賣超股數
// ========================================================

function getNetShares(row) {

    // 第一優先：
    // 原始三大法人欄位

    const candidates = [

        row["投信買賣超股數"],

        row["投信買賣超"],

        row["investment_trust_shares"],

        row["net_shares"],

        row["net"]

    ];


    for (
        const value of candidates
    ) {


        const n =
            Number(value);


        if (
            Number.isFinite(n)
        ) {

            return n;

        }

    }


    return 0;

}


// ========================================================
// 取得投信資金
// ========================================================

function getInvestmentTrustMoney(
    row
) {


    const candidates = [

        row.investment_trust_money,

        row["investmentTrustMoney"],

        row["投信買賣超金額"],

        row["net_money"]

    ];


    for (
        const value of candidates
    ) {


        const n =
            Number(value);


        if (
            Number.isFinite(n)
        ) {

            return n;

        }

    }


    return 0;

}


// ========================================================
// 建立統一資料格式
// ========================================================

function normalizeRows() {


    const source =
        getInvestmentTrustData();


    return source.map(
        row => {


            const netShares =
                getNetShares(
                    row
                );


            const money =
                getInvestmentTrustMoney(
                    row
                );


            return {

                stock_id:
                    row.stock_id ??
                    row["證券代號"] ??
                    row.code ??
                    "-",

                stock_name:
                    row.stock_name ??
                    row["證券名稱"] ??
                    row.name ??
                    "-",

                net_shares:
                    netShares,

                net_money:
                    money

            };

        }
    );

}


// ========================================================
// 排序
// ========================================================

function sortRows(
    rows,
    type
) {


    const result =
        [
            ...rows
        ];


    if (
        type === "buy"
    ) {


        result.sort(
            (a, b) =>
                b.net_shares
                -
                a.net_shares
        );


    }
    else if (
        type === "sell"
    ) {


        result.sort(
            (a, b) =>
                a.net_shares
                -
                b.net_shares
        );


    }
    else if (
        type === "net_money"
    ) {


        result.sort(
            (a, b) =>
                b.net_money
                -
                a.net_money
        );


    }
    else {


        result.sort(
            (a, b) =>
                Math.abs(
                    b.net_shares
                )
                -
                Math.abs(
                    a.net_shares
                )
        );

    }


    return result;

}


// ========================================================
// 顯示表格
// ========================================================

function renderTable() {


    const body =
        document.getElementById(
            "tableBody"
        );


    const limit =
        Number(
            document
                .getElementById(
                    "limitSelect"
                )
                .value
        );


    let rows =
        sortRows(
            currentRows,
            currentType
        );


    // ====================================================
    // 如果搜尋股票
    // ====================================================

    const keyword =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    if (
        keyword
    ) {


        rows =
            rows.filter(
                row => {


                    const id =
                        String(
                            row.stock_id
                        )
                        .toLowerCase();


                    const name =
                        String(
                            row.stock_name
                        )
                        .toLowerCase();


                    return (
                        id.includes(
                            keyword
                        )
                        ||
                        name.includes(
                            keyword
                        )
                    );

                }
            );

    }


    rows =
        rows.slice(
            0,
            limit
        );


    body.innerHTML = "";


    if (
        rows.length === 0
    ) {


        body.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="message"
                >

                    沒有符合條件的資料。

                </td>

            </tr>

        `;


        return;

    }


    rows.forEach(
        (
            row,
            index
        ) => {


            const net =
                row.net_shares;


            const css =
                net > 0
                    ? "positive"
                    : net < 0
                        ? "negative"
                        : "";


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td class="rank">

                    ${index + 1}

                </td>


                <td class="stock-id">

                    ${row.stock_id}

                </td>


                <td>

                    ${row.stock_name}

                </td>


                <td
                    class="${css}"
                >

                    ${sharesToLots(
                        net
                    )}

                    張

                </td>


                <td
                    class="${css}"
                >

                    ${formatMoney(
                        row.net_money
                    )}

                    元

                </td>

            `;


            body.appendChild(
                tr
            );

        }
    );

}


// ========================================================
// 搜尋
// ========================================================

function searchStock() {

    renderTable();

}


// ========================================================
// 載入 money_rank.json
// ========================================================

async function loadData() {


    try {


        const response =
            await fetch(
                "money_rank.json?ts="
                + Date.now()
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "money_rank.json 載入失敗"
            );

        }


        moneyData =
            await response.json();


        // ==================================================
        // 日期
        // ==================================================

        const date =
            moneyData.data_date ??
            "-";


        document
            .getElementById(
                "dataDate"
            )
            .textContent =
            `資料日期：${date}`;


        // ==================================================
        // 建立投信資料
        // ==================================================

        currentRows =
            normalizeRows();


        // ==================================================
        // 顯示資料筆數
        // ==================================================

        document
            .getElementById(
                "searchStatus"
            )
            .textContent =
            `已載入 ${currentRows.length} 筆投信排行資料`;


        // ==================================================
        // 顯示表格
        // ==================================================

        renderTable();


    }
    catch(error) {


        console.error(
            error
        );


        document
            .getElementById(
                "searchStatus"
            )
            .innerHTML = `

                <span
                    class="error-message"
                >

                    ❌ ${error.message}

                </span>

            `;


        document
            .getElementById(
                "tableBody"
            )
            .innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="message error-message"
                >

                    無法載入投信資料。

                    <br><br>

                    請確認
                    <strong>
                        money_rank.json
                    </strong>
                    是否與
                    <strong>
                        broker.html
                    </strong>
                    位於同一個資料夾。

                </td>

            </tr>

        `;

    }

}


// ========================================================
// 排序按鈕
// ========================================================

document
    .querySelectorAll(
        ".tab"
    )
    .forEach(
        button => {


            button.addEventListener(
                "click",
                function() {


                    document
                        .querySelectorAll(
                            ".tab"
                        )
                        .forEach(
                            btn =>
                                btn.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    this.classList.add(
                        "active"
                    );


                    currentType =
                        this.dataset.type;


                    renderTable();

                }
            );

        }
    );


// ========================================================
// TOP 選擇
// ========================================================

document
    .getElementById(
        "limitSelect"
    )
    .addEventListener(
        "change",
        function() {

            renderTable();

        }
    );


// ========================================================
// 搜尋按鈕
// ========================================================

document
    .getElementById(
        "searchButton"
    )
    .addEventListener(
        "click",
        searchStock
    );


// ========================================================
// Enter 搜尋
// ========================================================

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                searchStock();

            }

        }
    );


// ========================================================
// 啟動
// ========================================================

loadData();

</script>


</body>

</html>
