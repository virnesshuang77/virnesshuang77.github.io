<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>投信買賣超</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f5f7fa;
    color: #222;
}

.wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 50px;
}


/* =========================
   Header
========================= */

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
    flex-wrap: wrap;
}

.brand {
    font-size: 23px;
    font-weight: 900;
    white-space: nowrap;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.nav-btn {
    display: inline-block;
    text-decoration: none;
    border: 1px solid #d5dee8;
    background: #fff;
    color: #18222c;
    border-radius: 9px;
    padding: 9px 13px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.15s;
    white-space: nowrap;
}

.nav-btn:hover {
    background: #f3f6f9;
}

.nav-btn.active {
    background: #222;
    color: #fff;
    border-color: #222;
}


/* =========================
   Title
========================= */

h1 {
    margin: 0 0 5px;
    font-size: 32px;
}

.date {
    color: #777;
    margin-bottom: 25px;
}


/* =========================
   Search
========================= */

.search-area {
    background: white;
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    margin-bottom: 20px;
}

.search-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 10px;
}

.search-row {
    display: flex;
    gap: 10px;
}

.search-row input {
    flex: 1;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    min-width: 0;
}

.search-row input:focus {
    outline: none;
    border-color: #222;
}

.search-row button {
    padding: 13px 25px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    cursor: pointer;
    font-weight: 700;
}

.search-row button:hover {
    background: #111;
}

.status {
    margin-top: 10px;
    color: #777;
    font-size: 14px;
}


/* =========================
   Info
========================= */

.info-box {
    background: white;
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 20px;
    color: #666;
    font-size: 14px;
    line-height: 1.7;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04);
}

.info-box strong {
    color: #222;
}


/* =========================
   Controls
========================= */

.controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.tab {
    border: 1px solid #ddd;
    background: white;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.15s;
}

.tab:hover {
    background: #f3f6f9;
}

.tab.active {
    background: #222;
    color: white;
    border-color: #222;
}

.limit-select {
    padding: 10px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
    font-size: 14px;
}


/* =========================
   Table
========================= */

.table-wrapper {
    background: white;
    border-radius: 14px;
    overflow-x: auto;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
}

th {
    background: #f0f2f5;
    padding: 14px;
    text-align: right;
    font-weight: 800;
    white-space: nowrap;
}

th:first-child,
th:nth-child(2),
th:nth-child(3) {
    text-align: left;
}

td {
    padding: 13px 14px;
    border-top: 1px solid #eee;
    text-align: right;
    white-space: nowrap;
}

td:first-child,
td:nth-child(2),
td:nth-child(3) {
    text-align: left;
}

tr:hover {
    background: #fafafa;
}

.rank {
    font-weight: 800;
    color: #777;
}

.stock-id {
    font-family: monospace;
    color: #666;
}

.positive {
    color: #d32f2f;
    font-weight: bold;
}

.negative {
    color: #16803c;
    font-weight: bold;
}

.message {
    text-align: center !important;
    padding: 45px !important;
    color: #777;
}

.error-message {
    color: #c62828;
    font-weight: bold;
}


/* =========================
   Mobile
========================= */

@media (max-width: 850px) {

    .wrap {
        padding: 18px 12px 40px;
    }

    .top {
        align-items: flex-start;
        margin-bottom: 22px;
    }

    .brand {
        width: 100%;
    }

    .actions {
        width: 100%;
    }

    .nav-btn {
        flex: 1;
        text-align: center;
    }

    h1 {
        font-size: 28px;
    }

    .search-row {
        flex-direction: column;
    }

    .search-row button {
        width: 100%;
    }

    .tabs {
        width: 100%;
    }

    .tab {
        flex: 1;
        min-width: 90px;
    }

    .limit-select {
        width: 100%;
    }

}

</style>

</head>


<body>

<div class="wrap">


<!-- =====================================================
     Header
===================================================== -->

<header class="top">

    <div class="brand">
        📈 投資績效名片
    </div>

    <div class="actions">

        <a
            class="nav-btn"
            href="index.html"
        >
            📊 融資融券維持率
        </a>

        <a
            class="nav-btn"
            href="foreign.html"
        >
            🏦 外資買賣超
        </a>

        <a
            class="nav-btn active"
            href="broker.html"
        >
            🏢 投信買賣超
        </a>

    </div>

</header>


<!-- =====================================================
     Title
===================================================== -->

<h1>
    🏢 投信買賣超
</h1>

<div
    class="date"
    id="dataDate"
>
    資料載入中...
</div>


<!-- =====================================================
     Search
===================================================== -->

<div class="search-area">

    <div class="search-title">
        搜尋股票
    </div>

    <div class="search-row">

        <input
            id="searchInput"
            type="text"
            placeholder="輸入股票代號或名稱，例如：2330、台積電"
        >

        <button
            id="searchButton"
        >
            搜尋
        </button>

    </div>

    <div
        class="status"
        id="searchStatus"
    >
        正在讀取資料...
    </div>

</div>


<!-- =====================================================
     Info
===================================================== -->

<div class="info-box">

    <strong>資料說明：</strong>

    投信買賣超數量來自每日法人交易資料。

    <br>

    數量單位：
    <strong>張</strong>

    ；金額單位：
    <strong>元</strong>。

</div>


<!-- =====================================================
     Controls
===================================================== -->

<div class="controls">

    <div class="tabs">

        <button
            class="tab active"
            data-type="buy"
        >
            買超
        </button>

        <button
            class="tab"
            data-type="sell"
        >
            賣超
        </button>

        <button
            class="tab"
            data-type="net_money"
        >
            淨買超金額
        </button>

        <button
            class="tab"
            data-type="all"
        >
            全部
        </button>

    </div>


    <select
        id="limitSelect"
        class="limit-select"
    >

        <option value="10">
            TOP 10
        </option>

        <option value="20">
            TOP 20
        </option>

        <option value="50">
            TOP 50
        </option>

        <option value="100">
            TOP 100
        </option>

    </select>

</div>


<!-- =====================================================
     Table
===================================================== -->

<div class="table-wrapper">

<table>

<thead>

<tr>

    <th>
        Rank
    </th>

    <th>
        股票代號
    </th>

    <th>
        股票名稱
    </th>

    <th>
        投信買賣超
    </th>

    <th>
        投信金額
    </th>

</tr>

</thead>


<tbody id="tableBody">
</tbody>


</table>

</div>


</div>


<script>


// ========================================================
// 全域變數
// ========================================================

let stockData = null;

let moneyData = null;

let currentRows = [];

let currentType = "buy";


// ========================================================
// 安全轉數字
// ========================================================

function toNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return 0;
    }

    const cleaned =
        String(value)
            .replace(/,/g, "")
            .replace(/ /g, "")
            .trim();

    const n =
        Number(cleaned);

    return Number.isFinite(n)
        ? n
        : 0;
}


// ========================================================
// 金額格式
// ========================================================

function formatMoney(value) {

    return toNumber(value)
        .toLocaleString("zh-TW");
}


// ========================================================
// 股數轉張
// ========================================================

function sharesToLots(value) {

    const shares =
        toNumber(value);

    const lots =
        shares / 1000;

    return lots.toLocaleString(
        "zh-TW",
        {
            maximumFractionDigits: 2
        }
    );
}


// ========================================================
// 取得 data.json 的陣列
// ========================================================

function getDataRows(data) {

    if (
        Array.isArray(data)
    ) {
        return data;
    }

    if (!data) {
        return [];
    }

    const candidates = [

        data.data,

        data.stocks,

        data.rows,

        data.result,

        data.results,

        data.records

    ];

    for (
        const item of candidates
    ) {

        if (
            Array.isArray(item)
        ) {
            return item;
        }

    }

    return [];
}


// ========================================================
// 股票代號
// ========================================================

function getStockId(row) {

    return String(

        row.stock_id ??
        row.stock_code ??
        row["證券代號"] ??
        row.code ??
        row.id ??
        ""

    ).trim();

}


// ========================================================
// 股票名稱
// ========================================================

function getStockName(row) {

    return String(

        row.stock_name ??
        row["證券名稱"] ??
        row.name ??
        ""

    ).trim();

}


// ========================================================
// 投信買賣超股數
// ========================================================

function getTrustNetShares(row) {

    const candidates = [

        row.investment_trust,

        row.investment_trust_shares,

        row.investmentTrust,

        row["投信買賣超股數"],

        row["投信買賣超"],

        row.trust_net,

        row.trust_net_shares

    ];


    for (
        const value of candidates
    ) {

        if (
            value !== undefined &&
            value !== null &&
            value !== ""
        ) {

            return toNumber(value);

        }

    }

    return 0;

}


// ========================================================
// 建立投信資料
//
// data.json
//     ↓
// 投信買賣超股數
//
// money_rank.json
//     ↓
// investment_trust
//     ↓
// investment_trust_money
// ========================================================

function buildRows() {


    // ----------------------------------------------------
    // data.json
    // ----------------------------------------------------

    const dataRows =
        getDataRows(
            stockData
        );


    // ----------------------------------------------------
    // money_rank.json
    //
    // 這裡直接指定 investment_trust
    // 不再使用模糊搜尋。
    // ----------------------------------------------------

    const moneyRows =
        Array.isArray(
            moneyData?.investment_trust
        )
            ? moneyData.investment_trust
            : [];


    // ----------------------------------------------------
    // 建立股票代號 → 投信金額
    // ----------------------------------------------------

    const moneyMap =
        new Map();


    moneyRows.forEach(
        row => {

            const id =
                getStockId(row);


            if (!id) {
                return;
            }


            const money =
                toNumber(
                    row.investment_trust_money
                );


            moneyMap.set(
                id,
                money
            );

        }
    );


    // ----------------------------------------------------
    // 建立最後資料
    // ----------------------------------------------------

    const rows = [];


    dataRows.forEach(
        row => {

            const stockId =
                getStockId(row);


            if (!stockId) {
                return;
            }


            const stockName =
                getStockName(row);


            const netShares =
                getTrustNetShares(row);


            const netMoney =
                moneyMap.has(stockId)
                    ? moneyMap.get(stockId)
                    : 0;


            rows.push({

                stock_id:
                    stockId,

                stock_name:
                    stockName,

                net_shares:
                    netShares,

                net_money:
                    netMoney

            });

        }
    );


    // ----------------------------------------------------
    // 偵錯資訊
    // ----------------------------------------------------

    console.log(
        "========== 投信資料偵錯 =========="
    );

    console.log(
        "data.json 筆數：",
        dataRows.length
    );

    console.log(
        "money_rank.json investment_trust 筆數：",
        moneyRows.length
    );

    console.log(
        "成功對應金額筆數：",
        rows.filter(
            row =>
                row.net_money !== 0
        ).length
    );

    if (
        moneyRows.length > 0
    ) {

        console.log(
            "money_rank 第一筆：",
            moneyRows[0]
        );

    }

    if (
        rows.length > 0
    ) {

        console.log(
            "最終第一筆：",
            rows[0]
        );

    }

    console.log(
        "=================================="
    );


    return rows;

}


// ========================================================
// 排序
// ========================================================

function sortRows(rows) {

    const result =
        [...rows];


    if (
        currentType === "buy"
    ) {

        result.sort(
            (a, b) =>
                b.net_shares -
                a.net_shares
        );

    }
    else if (
        currentType === "sell"
    ) {

        result.sort(
            (a, b) =>
                a.net_shares -
                b.net_shares
        );

    }
    else if (
        currentType === "net_money"
    ) {

        result.sort(
            (a, b) =>
                b.net_money -
                a.net_money
        );

    }
    else {

        result.sort(
            (a, b) =>
                Math.abs(b.net_shares)
                -
                Math.abs(a.net_shares)
        );

    }


    return result;

}


// ========================================================
// 顯示表格
// ========================================================

function renderTable() {

    const body =
        document.getElementById(
            "tableBody"
        );


    let rows =
        sortRows(
            currentRows
        );


    // ----------------------------------------------------
    // 搜尋
    // ----------------------------------------------------

    const keyword =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    if (keyword) {

        rows =
            rows.filter(
                row => {

                    const id =
                        String(
                            row.stock_id
                        )
                        .toLowerCase();

                    const name =
                        String(
                            row.stock_name
                        )
                        .toLowerCase();

                    return (
                        id.includes(keyword)
                        ||
                        name.includes(keyword)
                    );

                }
            );

    }


    // ----------------------------------------------------
    // TOP
    // ----------------------------------------------------

    const limit =
        Number(
            document
                .getElementById(
                    "limitSelect"
                )
                .value
        );


    rows =
        rows.slice(
            0,
            limit
        );


    body.innerHTML = "";


    if (
        rows.length === 0
    ) {

        body.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="message"
                >
                    沒有符合條件的投信資料。
                </td>

            </tr>

        `;

        return;

    }


    rows.forEach(
        (
            row,
            index
        ) => {

            const net =
                row.net_shares;


            const netMoney =
                row.net_money;


            const shareClass =
                net > 0
                    ? "positive"
                    : net < 0
                        ? "negative"
                        : "";


            const moneyClass =
                netMoney > 0
                    ? "positive"
                    : netMoney < 0
                        ? "negative"
                        : "";


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td class="rank">
                    ${index + 1}
                </td>

                <td class="stock-id">
                    ${row.stock_id}
                </td>

                <td>
                    ${row.stock_name || "-"}
                </td>

                <td class="${shareClass}">
                    ${sharesToLots(net)}
                    張
                </td>

                <td class="${moneyClass}">
    ${(netMoney / 100000000).toFixed(2)}
    億
</td>

            `;


            body.appendChild(
                tr
            );

        }
    );

}


// ========================================================
// 載入資料
// ========================================================

async function loadData() {

    try {

        // ------------------------------------------------
        // 同時取得兩個 JSON
        // ------------------------------------------------

        const [
            dataResponse,
            moneyResponse
        ] = await Promise.all([

            fetch(
                "data.json?ts="
                + Date.now()
            ),

            fetch(
                "money_rank.json?ts="
                + Date.now()
            )

        ]);


        // ------------------------------------------------
        // data.json
        // ------------------------------------------------

        if (
            !dataResponse.ok
        ) {

            throw new Error(
                "data.json 載入失敗"
            );

        }


        stockData =
            await dataResponse.json();


        // ------------------------------------------------
        // money_rank.json
        // ------------------------------------------------

        if (
            !moneyResponse.ok
        ) {

            throw new Error(
                "money_rank.json 載入失敗"
            );

        }


        moneyData =
            await moneyResponse.json();


        // ------------------------------------------------
        // 日期
        // ------------------------------------------------

        const date =
            stockData.data_date ??
            stockData.date ??
            moneyData?.data_date ??
            moneyData?.date ??
            "-";


        document
            .getElementById(
                "dataDate"
            )
            .textContent =
            `資料日期：${date}`;


        // ------------------------------------------------
        // 建立資料
        // ------------------------------------------------

        currentRows =
            buildRows();


        // ------------------------------------------------
        // 計算對應狀況
        // ------------------------------------------------

        const moneyRows =
            Array.isArray(
                moneyData?.investment_trust
            )
                ? moneyData.investment_trust
                : [];


        const matchedCount =
            currentRows.filter(
                row =>
                    row.net_money !== 0
            ).length;


        document
            .getElementById(
                "searchStatus"
            )
            .textContent =
            `data.json：${currentRows.length} 筆`
            +
            `｜投信金額資料：${moneyRows.length} 筆`
            +
            `｜成功對應：${matchedCount} 筆`;


        // ------------------------------------------------
        // 顯示
        // ------------------------------------------------

        renderTable();

    }
    catch (error) {

        console.error(
            "投信資料載入錯誤：",
            error
        );


        document
            .getElementById(
                "searchStatus"
            )
            .innerHTML = `

                <span class="error-message">

                    ❌ ${error.message}

                </span>

            `;


        document
            .getElementById(
                "tableBody"
            )
            .innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="message error-message"
                >

                    無法載入投信資料。

                    <br><br>

                    請確認：

                    <br>

                    data.json

                    <br>

                    money_rank.json

                </td>

            </tr>

        `;

    }

}


// ========================================================
// 排序按鈕
// ========================================================

document
    .querySelectorAll(
        ".tab"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(
                            ".tab"
                        )
                        .forEach(
                            btn => {

                                btn.classList
                                    .remove(
                                        "active"
                                    );

                            }
                        );


                    this.classList.add(
                        "active"
                    );


                    currentType =
                        this.dataset.type;


                    renderTable();

                }
            );

        }
    );


// ========================================================
// TOP
// ========================================================

document
    .getElementById(
        "limitSelect"
    )
    .addEventListener(
        "change",
        renderTable
    );


// ========================================================
// 搜尋
// ========================================================

document
    .getElementById(
        "searchButton"
    )
    .addEventListener(
        "click",
        renderTable
    );


// ========================================================
// Enter
// ========================================================

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                renderTable();

            }

        }
    );


// ========================================================
// 啟動
// ========================================================

loadData();

</script>

</body>

</html>
