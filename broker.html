<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>券商分點籌碼</title>

<style>

/* =========================================================
   基本設定
========================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

    background: #f5f7fa;

    color: #222;

}


.wrap {

    max-width: 1200px;

    margin: 0 auto;

    padding:
        24px
        20px
        50px;

}


/* =========================================================
   Header
========================================================= */

.top {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 14px;

    margin-bottom: 28px;

    flex-wrap: wrap;

}


.brand {

    font-size: 23px;

    font-weight: 900;

    white-space: nowrap;

}


.actions {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

}


.nav-btn {

    display: inline-block;

    text-decoration: none;

    border:
        1px solid
        #d5dee8;

    background: #fff;

    color: #18222c;

    border-radius: 9px;

    padding:
        9px
        13px;

    font-weight: 800;

    cursor: pointer;

    transition: 0.15s;

    white-space: nowrap;

}


.nav-btn:hover {

    background: #f3f6f9;

}


.nav-btn.active {

    background: #222;

    color: #fff;

    border-color: #222;

}


/* =========================================================
   標題
========================================================= */

h1 {

    margin:
        0
        0
        5px;

    font-size: 32px;

}


.date {

    color: #777;

    margin-bottom: 25px;

}


/* =========================================================
   券商選擇區
========================================================= */

.search-area {

    background: white;

    padding: 22px;

    border-radius: 14px;

    box-shadow:
        0
        4px
        14px
        rgba(0,0,0,0.05);

    margin-bottom: 20px;

}


.search-title {

    font-size: 17px;

    font-weight: bold;

    margin-bottom: 10px;

}


.broker-select {

    width: 100%;

    padding: 15px;

    border:
        1px
        solid
        #ccc;

    border-radius: 8px;

    background: white;

    font-size: 16px;

    color: #222;

}


.broker-select:focus {

    outline: none;

    border-color: #222;

}


.status {

    margin-top: 10px;

    color: #777;

    font-size: 14px;

}


.search-row {

    display: flex;

    gap: 10px;

    margin-top: 15px;

}


.search-row input {

    flex: 1;

    padding: 13px;

    border:
        1px
        solid
        #ddd;

    border-radius: 8px;

    font-size: 16px;

    min-width: 0;

}


.search-row input:focus {

    outline: none;

    border-color: #222;

}


.search-row button {

    padding:
        13px
        24px;

    border: none;

    border-radius: 8px;

    background: #222;

    color: white;

    cursor: pointer;

    font-weight: 700;

}


.search-row button:hover {

    background: #111;

}


/* =========================================================
   分點資訊
========================================================= */

.broker-title {

    display: none;

    background: white;

    padding: 20px;

    border-radius: 14px;

    margin-bottom: 20px;

    box-shadow:
        0
        4px
        14px
        rgba(0,0,0,0.05);

}


.broker-title.show {

    display: block;

}


.broker-name {

    font-size: 22px;

    font-weight: bold;

}


.broker-detail {

    color: #777;

    margin-top: 6px;

    line-height: 1.7;

}


.demo-warning {

    margin-top: 12px;

    padding:
        10px
        14px;

    background: #fff8e1;

    border-radius: 8px;

    color: #8a6500;

    display: inline-block;

}


/* =========================================================
   控制按鈕
========================================================= */

.controls {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 20px;

    flex-wrap: wrap;

}


.tabs {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

}


.tab {

    border:
        1px
        solid
        #ddd;

    background: white;

    padding:
        10px
        16px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 14px;

    transition: 0.15s;

}


.tab:hover {

    background: #f3f6f9;

}


.tab.active {

    background: #222;

    color: white;

    border-color: #222;

}


.limit-select {

    padding:
        10px
        14px;

    border:
        1px
        solid
        #ddd;

    border-radius: 8px;

    background: white;

    font-size: 14px;

}


/* =========================================================
   表格
========================================================= */

.table-wrapper {

    background: white;

    border-radius: 14px;

    overflow-x: auto;

    box-shadow:
        0
        4px
        14px
        rgba(0,0,0,0.05);

}


table {

    width: 100%;

    border-collapse:
        collapse;

    min-width: 850px;

}


th {

    background: #f0f2f5;

    padding: 14px;

    text-align: right;

    font-weight: 800;

}


th:first-child,
th:nth-child(2),
th:nth-child(3) {

    text-align: left;

}


td {

    padding:
        13px
        14px;

    border-top:
        1px
        solid
        #eee;

    text-align: right;

}


td:first-child,
td:nth-child(2),
td:nth-child(3) {

    text-align: left;

}


tr:hover {

    background: #fafafa;

}


.stock-id {

    font-family: monospace;

    color: #666;

}


.positive {

    color: #d32f2f;

    font-weight: bold;

}


.negative {

    color: #16803c;

    font-weight: bold;

}


.message {

    text-align:
        center !important;

    padding:
        45px !important;

    color: #777;

}


.error-message {

    color: #c62828;

    font-weight: bold;

}


/* =========================================================
   手機
========================================================= */

@media (max-width: 850px) {

    .wrap {

        padding:
            18px
            12px
            40px;

    }


    .top {

        align-items:
            flex-start;

        margin-bottom: 22px;

    }


    .brand {

        width: 100%;

    }


    .actions {

        width: 100%;

    }


    .nav-btn {

        flex: 1;

        text-align: center;

    }


    h1 {

        font-size: 28px;

    }


    .search-row {

        flex-direction:
            column;

    }


    .search-row button {

        width: 100%;

    }


    .tabs {

        width: 100%;

    }


    .tab {

        flex: 1;

        min-width: 90px;

    }


    .limit-select {

        width: 100%;

    }

}

</style>

</head>


<body>


<div class="wrap">


<!-- =====================================================
     Header
===================================================== -->

<header class="top">

    <div class="brand">
        📈 投資績效名片
    </div>


    <div class="actions">

        <a
            class="nav-btn"
            href="index.html"
        >
            📊 融資融券維持率
        </a>


        <a
            class="nav-btn"
            href="foreign.html"
        >
            🏦 法人買賣超
        </a>


        <a
            class="nav-btn active"
            href="broker.html"
        >
            🏢 券商分點
        </a>

    </div>

</header>


<!-- =====================================================
     標題
===================================================== -->

<h1>
    券商分點籌碼
</h1>


<div
    class="date"
    id="dataDate"
>
    資料載入中...
</div>


<!-- =====================================================
     券商選擇
===================================================== -->

<div class="search-area">


    <div class="search-title">
        選擇券商分點
    </div>


    <select
        id="brokerSelect"
        class="broker-select"
    >

        <option value="">
            正在載入券商分點...
        </option>

    </select>


    <div
        class="status"
        id="brokerStatus"
    >
        正在讀取券商主檔...
    </div>


    <div class="search-row">


        <input
            id="searchInput"
            type="text"
            placeholder="搜尋券商，例如：元大、富邦、麥格理"
        >


        <button
            id="searchButton"
        >
            搜尋
        </button>


    </div>


</div>


<!-- =====================================================
     注意：
     這裡故意沒有任何「請選擇券商分點」
     
     選擇券商後才會顯示資訊。
===================================================== -->

<div
    class="broker-title"
    id="brokerTitle"
></div>


<!-- =====================================================
     排序
===================================================== -->

<div class="controls">


    <div class="tabs">


        <button
            class="tab active"
            data-type="buy"
        >
            買超
        </button>


        <button
            class="tab"
            data-type="sell"
        >
            賣超
        </button>


        <button
            class="tab"
            data-type="buy_money"
        >
            買進金額
        </button>


        <button
            class="tab"
            data-type="sell_money"
        >
            賣出金額
        </button>


        <button
            class="tab"
            data-type="net_money"
        >
            淨買超金額
        </button>


        <button
            class="tab"
            data-type="all"
        >
            全部
        </button>


    </div>


    <select
        id="limitSelect"
        class="limit-select"
    >

        <option value="10">
            TOP 10
        </option>

        <option value="20">
            TOP 20
        </option>

        <option value="50">
            TOP 50
        </option>

        <option value="999999">
            全部
        </option>

    </select>


</div>


<!-- =====================================================
     表格
     
     這裡完全空白。
     不再顯示第二個「請選擇券商分點」。
===================================================== -->

<div class="table-wrapper">


<table>


<thead>

<tr>

    <th>
        Rank
    </th>

    <th>
        股票代號
    </th>

    <th>
        股票名稱
    </th>

    <th>
        買進
    </th>

    <th>
        賣出
    </th>

    <th>
        淨買超
    </th>

    <th>
        淨買超金額
    </th>

</tr>

</thead>


<tbody id="tableBody">
</tbody>


</table>


</div>


</div>


<script>


// ========================================================
// 全域資料
// ========================================================

let brokerMaster = null;

let brokerTradeData = null;

let currentMasterBroker = null;

let currentBroker = null;

let currentType = "buy";


// ========================================================
// 安全取得券商代號
//
// 優先使用 broker_code。
// 同時兼容舊格式。
// ========================================================

function getBrokerCode(broker) {

    if (!broker) {

        return "";

    }


    return String(

        broker.broker_code ??
        broker.broker_id ??
        broker.code ??
        broker.id ??
        ""

    ).trim();

}


// ========================================================
// 券商名稱
// ========================================================

function getBrokerName(broker) {

    if (!broker) {

        return "";

    }


    return String(

        broker.broker_name ??
        broker.name ??
        ""

    ).trim();

}


// ========================================================
// 地址
// ========================================================

function getBrokerAddress(broker) {

    if (!broker) {

        return "";

    }


    return String(

        broker.address ??
        broker.addr ??
        ""

    ).trim();

}


// ========================================================
// 電話
// ========================================================

function getBrokerPhone(broker) {

    if (!broker) {

        return "";

    }


    return String(

        broker.phone ??
        broker.tel ??
        ""

    ).trim();

}


// ========================================================
// 數字格式
// ========================================================

function formatNumber(value) {

    const n = Number(value);


    if (!Number.isFinite(n)) {

        return "-";

    }


    return n.toLocaleString(
        "zh-TW"
    );

}


// ========================================================
// 金額格式
// ========================================================

function formatMoney(value) {

    const n = Number(value);


    if (!Number.isFinite(n)) {

        return "-";

    }


    const abs =
        Math.abs(n);


    if (abs >= 100000000) {

        return (
            (n / 100000000)
                .toFixed(2)
            + " 億"
        );

    }


    if (abs >= 10000) {

        return (
            (n / 10000)
                .toFixed(0)
            + " 萬"
        );

    }


    return n.toLocaleString(
        "zh-TW"
    );

}


// ========================================================
// 建立券商下拉選單
// ========================================================

function buildBrokerSelect() {


    const select =
        document.getElementById(
            "brokerSelect"
        );


    select.innerHTML = "";


    const first =
        document.createElement(
            "option"
        );


    first.value = "";


    const count =
        Array.isArray(
            brokerMaster?.brokers
        )
            ? brokerMaster.brokers.length
            : 0;


    first.textContent =
        `請選擇券商分點（共 ${count} 個）`;


    select.appendChild(
        first
    );


    if (
        !Array.isArray(
            brokerMaster?.brokers
        )
    ) {

        document
            .getElementById(
                "brokerStatus"
            )
            .textContent =
            "❌ broker_master.json 格式錯誤";

        return;

    }


    brokerMaster.brokers.forEach(
        broker => {


            const code =
                getBrokerCode(
                    broker
                );


            const name =
                getBrokerName(
                    broker
                );


            if (
                !code &&
                !name
            ) {

                return;

            }


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                code;


            option.textContent =
                code
                    ? `${name}（${code}）`
                    : name;


            select.appendChild(
                option
            );

        }
    );


    document
        .getElementById(
            "brokerStatus"
        )
        .textContent =
        `已載入 ${count} 個券商分點`;

}


// ========================================================
// 顯示分點資料
// ========================================================

function showBrokerInfo(
    broker
) {


    const box =
        document.getElementById(
            "brokerTitle"
        );


    const name =
        getBrokerName(
            broker
        );


    const code =
        getBrokerCode(
            broker
        );


    const address =
        getBrokerAddress(
            broker
        );


    const phone =
        getBrokerPhone(
            broker
        );


    box.innerHTML = `

        <div class="broker-name">

            ${name || "券商分點"}

        </div>


        <div class="broker-detail">

            分點代號：
            ${code || "-"}

            <br>

            地址：
            ${address || "-"}

            <br>

            電話：
            ${phone || "-"}

        </div>

    `;


    box.classList.add(
        "show"
    );

}


// ========================================================
// 沒有每日交易資料
// ========================================================

function showNoTradeData() {


    document
        .getElementById(
            "tableBody"
        )
        .innerHTML = `

        <tr>

            <td
                colspan="7"
                class="message"
            >

                此分點已存在於官方券商主檔。

                <br><br>

                目前尚未接入
                「每日分點交易資料」。

            </td>

        </tr>

    `;

}


// ========================================================
// 選擇券商
// ========================================================

function selectBrokerByCode(
    brokerCode
) {


    if (
        !brokerMaster ||
        !Array.isArray(
            brokerMaster.brokers
        )
    ) {

        return;

    }


    const code =
        String(
            brokerCode
        ).trim();


    const master =
        brokerMaster.brokers.find(
            broker =>
                getBrokerCode(
                    broker
                ) === code
        );


    if (!master) {

        return;

    }


    currentMasterBroker =
        master;


    showBrokerInfo(
        master
    );


    currentBroker =
        null;


    // ====================================================
    // 如果存在 broker_data.json
    // ====================================================

    if (
        brokerTradeData &&
        brokerTradeData.brokers
    ) {


        const brokers =
            Array.isArray(
                brokerTradeData.brokers
            )
                ? brokerTradeData.brokers
                : Object.values(
                    brokerTradeData.brokers
                );


        currentBroker =
            brokers.find(
                broker =>
                    getBrokerCode(
                        broker
                    ) === code
            );


        // 再用名稱比對

        if (!currentBroker) {


            const masterName =
                getBrokerName(
                    master
                );


            currentBroker =
                brokers.find(
                    broker =>
                        getBrokerName(
                            broker
                        ) === masterName
                );

        }

    }


    // ====================================================
    // 找到每日交易資料
    // ====================================================

    if (currentBroker) {


        renderTable(
            currentType
        );

    }


    // ====================================================
    // 找不到每日交易資料
    // ====================================================

    else {

        showNoTradeData();

    }

}


// ========================================================
// 顯示表格
// ========================================================

function renderTable(
    type
) {


    if (!currentBroker) {

        showNoTradeData();

        return;

    }


    currentType =
        type;


    let rows =
        Array.isArray(
            currentBroker.stocks
        )
            ? [
                ...currentBroker.stocks
            ]
            : [];


    // ====================================================
    // 買超
    // ====================================================

    if (
        type === "buy"
    ) {

        rows.sort(
            (a, b) =>
                Number(
                    b.net ?? 0
                )
                -
                Number(
                    a.net ?? 0
                )
        );

    }


    // ====================================================
    // 賣超
    // ====================================================

    else if (
        type === "sell"
    ) {

        rows.sort(
            (a, b) =>
                Number(
                    a.net ?? 0
                )
                -
                Number(
                    b.net ?? 0
                )
        );

    }


    // ====================================================
    // 買進金額
    // ====================================================

    else if (
        type === "buy_money"
    ) {

        rows.sort(
            (a, b) =>
                Number(
                    b.buy_money ?? 0
                )
                -
                Number(
                    a.buy_money ?? 0
                )
        );

    }


    // ====================================================
    // 賣出金額
    // ====================================================

    else if (
        type === "sell_money"
    ) {

        rows.sort(
            (a, b) =>
                Number(
                    b.sell_money ?? 0
                )
                -
                Number(
                    a.sell_money ?? 0
                )
        );

    }


    // ====================================================
    // 淨買超金額
    // ====================================================

    else if (
        type === "net_money"
    ) {

        rows.sort(
            (a, b) =>
                Number(
                    b.net_money ?? 0
                )
                -
                Number(
                    a.net_money ?? 0
                )
        );

    }


    // ====================================================
    // 全部
    // ====================================================

    else {

        rows.sort(
            (a, b) =>
                Math.abs(
                    Number(
                        b.net ?? 0
                    )
                )
                -
                Math.abs(
                    Number(
                        a.net ?? 0
                    )
                )
        );

    }


    const limit =
        Number(
            document
                .getElementById(
                    "limitSelect"
                )
                .value
        );


    rows =
        rows.slice(
            0,
            limit
        );


    const body =
        document.getElementById(
            "tableBody"
        );


    body.innerHTML = "";


    if (
        rows.length === 0
    ) {

        body.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="message"
                >

                    此券商目前沒有可顯示的交易資料。

                </td>

            </tr>

        `;

        return;

    }


    rows.forEach(
        (
            item,
            index
        ) => {


            const net =
                Number(
                    item.net ?? 0
                );


            const css =
                net > 0
                    ? "positive"
                    : net < 0
                        ? "negative"
                        : "";


            const stockId =
                item.stock_id ??
                item.stock_code ??
                item.code ??
                "-";


            const stockName =
                item.stock_name ??
                item.name ??
                "-";


            const buy =
                item.buy ??
                0;


            const sell =
                item.sell ??
                0;


            const netMoney =
                item.net_money ??
                0;


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td class="stock-id">
                    ${stockId}
                </td>

                <td>
                    ${stockName}
                </td>

                <td>
                    ${formatNumber(
                        buy
                    )}
                </td>

                <td>
                    ${formatNumber(
                        sell
                    )}
                </td>

                <td class="${css}">
                    ${formatNumber(
                        net
                    )}
                </td>

                <td class="${css}">
                    ${formatMoney(
                        netMoney
                    )}
                </td>

            `;


            body.appendChild(
                row
            );

        }
    );

}


// ========================================================
// 下拉選單
// ========================================================

document
    .getElementById(
        "brokerSelect"
    )
    .addEventListener(
        "change",
        function() {


            if (
                this.value
            ) {

                selectBrokerByCode(
                    this.value
                );

            }

        }
    );


// ========================================================
// 搜尋
// ========================================================

function searchBroker() {


    if (!brokerMaster) {

        return;

    }


    const keyword =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    if (!keyword) {

        return;

    }


    const broker =
        brokerMaster.brokers.find(
            item => {


                const name =
                    getBrokerName(
                        item
                    )
                    .toLowerCase();


                const code =
                    getBrokerCode(
                        item
                    )
                    .toLowerCase();


                return (
                    name.includes(
                        keyword
                    )
                    ||
                    code.includes(
                        keyword
                    )
                );

            }
        );


    if (!broker) {

        alert(
            `找不到券商：${keyword}`
        );

        return;

    }


    const code =
        getBrokerCode(
            broker
        );


    document
        .getElementById(
            "brokerSelect"
        )
        .value =
        code;


    selectBrokerByCode(
        code
    );

}


// ========================================================
// 搜尋按鈕
// ========================================================

document
    .getElementById(
        "searchButton"
    )
    .addEventListener(
        "click",
        searchBroker
    );


// ========================================================
// Enter 搜尋
// ========================================================

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                searchBroker();

            }

        }
    );


// ========================================================
// 排序按鈕
// ========================================================

document
    .querySelectorAll(
        ".tab"
    )
    .forEach(
        button => {


            button.addEventListener(
                "click",
                function() {


                    document
                        .querySelectorAll(
                            ".tab"
                        )
                        .forEach(
                            btn => {

                                btn.classList
                                    .remove(
                                        "active"
                                    );

                            }
                        );


                    this.classList.add(
                        "active"
                    );


                    currentType =
                        this.dataset.type;


                    if (
                        currentBroker
                    ) {

                        renderTable(
                            currentType
                        );

                    }

                }
            );

        }
    );


// ========================================================
// TOP 數量
// ========================================================

document
    .getElementById(
        "limitSelect"
    )
    .addEventListener(
        "change",
        function() {


            if (
                currentBroker
            ) {

                renderTable(
                    currentType
                );

            }

        }
    );


// ========================================================
// 載入資料
// ========================================================

async function loadData() {


    try {


        // ==================================================
        // 載入 broker_master.json
        // ==================================================

        const masterResponse =
            await fetch(
                "broker_master.json?ts="
                + Date.now()
            );


        if (
            !masterResponse.ok
        ) {

            throw new Error(
                "broker_master.json 載入失敗"
            );

        }


        brokerMaster =
            await masterResponse.json();


        if (
            !brokerMaster ||
            !Array.isArray(
                brokerMaster.brokers
            )
        ) {

            throw new Error(
                "broker_master.json 格式錯誤"
            );

        }


        // ==================================================
        // 嘗試載入每日交易資料
        // ==================================================

        brokerTradeData =
            null;


        try {


            const tradeResponse =
                await fetch(
                    "broker_data.json?ts="
                    + Date.now()
                );


            if (
                tradeResponse.ok
            ) {

                brokerTradeData =
                    await tradeResponse.json();

            }

        }
        catch(error) {

            console.warn(
                "目前沒有 broker_data.json"
            );

        }


        // ==================================================
        // 日期
        // ==================================================

        if (
            brokerTradeData &&
            brokerTradeData.data_date
        ) {

            document
                .getElementById(
                    "dataDate"
                )
                .textContent =
                `交易資料日期：${brokerTradeData.data_date}`;

        }
        else {

            document
                .getElementById(
                    "dataDate"
                )
                .textContent =
                "券商分點主檔";

        }


        // ==================================================
        // 建立券商選單
        // ==================================================

        buildBrokerSelect();


        // ==================================================
        // 重點：
        // 初始表格保持完全空白
        // 不再出現「請選擇券商分點」
        // ==================================================

        document
            .getElementById(
                "tableBody"
            )
            .innerHTML = "";


    }
    catch(error) {


        console.error(
            error
        );


        document
            .getElementById(
                "brokerStatus"
            )
            .innerHTML = `

                <span
                    class="error-message"
                >

                    ❌ ${error.message}

                </span>

            `;


        document
            .getElementById(
                "tableBody"
            )
            .innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="message error-message"
                >

                    無法載入券商主檔。

                    <br><br>

                    請確認
                    broker_master.json
                    與 broker.html
                    位於同一個資料夾。

                </td>

            </tr>

        `;

    }

}


// ========================================================
// 啟動
// ========================================================

loadData();


</script>
