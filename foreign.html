<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>外資買賣超</title>

<style>

/* =========================================================
   基本
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

    background: #f5f7fa;

    color: #222;
}

.wrap {
    max-width: 1200px;

    margin: 0 auto;

    padding:
        24px
        20px
        50px;
}


/* =========================================================
   Header
========================================================= */

.top {
    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 14px;

    margin-bottom: 28px;

    flex-wrap: wrap;
}

.brand {
    font-size: 23px;

    font-weight: 900;

    white-space: nowrap;
}

.actions {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

.nav-btn {
    display: inline-block;

    text-decoration: none;

    border:
        1px solid
        #d5dee8;

    background: #fff;

    color: #18222c;

    border-radius: 9px;

    padding:
        9px
        13px;

    font-weight: 800;

    cursor: pointer;

    transition: 0.15s;

    white-space: nowrap;
}

.nav-btn:hover {
    background: #f3f6f9;
}

.nav-btn.active {
    background: #222;

    color: #fff;

    border-color: #222;
}


/* =========================================================
   標題
========================================================= */

h1 {
    margin:
        0
        0
        5px;

    font-size: 32px;
}

.date {
    color: #777;

    margin-bottom: 25px;

    font-size: 16px;
}


/* =========================================================
   控制區
========================================================= */

.controls {
    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 20px;

    flex-wrap: wrap;
}


/* =========================================================
   三個模式按鈕
========================================================= */

.tabs {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

.tab {
    border:
        1px solid
        #ddd;

    background: white;

    padding:
        10px
        18px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 14px;

    font-weight: 700;

    transition: 0.15s;
}

.tab:hover {
    background: #f3f6f9;
}

.tab.active {
    background: #222;

    color: white;

    border-color: #222;
}


/* =========================================================
   TOP
========================================================= */

#topSelect {
    padding:
        10px
        14px;

    border:
        1px
        solid
        #ddd;

    border-radius: 8px;

    background: white;

    font-size: 15px;

    cursor: pointer;
}

#topSelect:focus {
    outline: none;

    border-color: #222;
}


/* =========================================================
   Summary
========================================================= */

.summary {
    width: 100%;

    color: #666;

    font-size: 14px;

    margin-top: -8px;

    margin-bottom: 15px;
}


/* =========================================================
   表格
========================================================= */

.table-wrapper {
    background: white;

    border-radius: 14px;

    overflow-x: auto;

    box-shadow:
        0
        4px
        14px
        rgba(0,0,0,0.05);
}

table {
    width: 100%;

    border-collapse: collapse;

    min-width: 800px;
}

thead th {
    background: #f0f2f5;

    padding:
        15px
        14px;

    text-align: right;

    white-space: nowrap;

    font-weight: 800;
}

thead th:first-child,
thead th:nth-child(2),
thead th:nth-child(3) {
    text-align: left;
}

tbody td {
    padding:
        14px;

    border-top:
        1px
        solid
        #eee;

    text-align: right;

    white-space: nowrap;
}

tbody td:first-child,
tbody td:nth-child(2),
tbody td:nth-child(3) {
    text-align: left;
}

tbody tr:hover {
    background: #fafafa;
}


/* =========================================================
   Rank
========================================================= */

.rank {
    width: 70px;

    font-weight: bold;

    color: #777;
}


/* =========================================================
   股票代號
========================================================= */

.stock-id {
    color: #555;

    font-family: monospace;
}


/* =========================================================
   買超
========================================================= */

.money-positive {
    color: #e53935;

    font-weight: bold;
}


/* =========================================================
   賣超
========================================================= */

.money-negative {
    color: #16803c;

    font-weight: bold;
}


/* =========================================================
   零
========================================================= */

.money-zero {
    color: #777;

    font-weight: bold;
}


/* =========================================================
   載入
========================================================= */

.loading {
    padding:
        55px !important;

    text-align:
        center !important;

    color: #777;
}


/* =========================================================
   錯誤
========================================================= */

.error {
    padding: 40px;

    text-align: center;

    color: #c62828;

    line-height: 1.8;
}


/* =========================================================
   手機
========================================================= */

@media (max-width: 850px) {

    .wrap {
        padding:
            18px
            12px
            40px;
    }

    .top {
        align-items:
            flex-start;

        margin-bottom: 22px;
    }

    .brand {
        width: 100%;
    }

    .actions {
        width: 100%;
    }

    .nav-btn {
        flex: 1;

        text-align: center;
    }

    h1 {
        font-size: 28px;
    }

    .controls {
        align-items:
            flex-start;

        flex-direction:
            column;
    }

    .tabs {
        width: 100%;
    }

    .tab {
        flex: 1;

        min-width: 90px;

        text-align: center;
    }

    #topSelect {
        width: 100%;
    }

}

</style>

</head>


<body>


<div class="wrap">


<!-- =====================================================
     Header
===================================================== -->

<header class="top">

    <div class="brand">

        📈 投資績效名片

    </div>


    <div class="actions">

        <a
            class="nav-btn"
            href="index.html"
        >

            📊 融資融券維持率

        </a>


        <a
            class="nav-btn active"
            href="foreign.html"
        >

            🏦 外資買賣超

        </a>


        <a
            class="nav-btn"
            href="broker.html"
        >

            🏢 投信買賣超

        </a>

    </div>

</header>


<!-- =====================================================
     標題
===================================================== -->

<h1>

    🏦 外資買賣超

</h1>


<div
    class="date"
    id="dataDate"
>

    資料載入中...

</div>


<!-- =====================================================
     控制
===================================================== -->

<div class="controls">


    <div class="tabs">


        <button
            class="tab active"
            data-type="buy"
        >

            🔴 買超

        </button>


        <button
            class="tab"
            data-type="sell"
        >

            🟢 賣超

        </button>


        <button
            class="tab"
            data-type="net"
        >

            ⚖️ 淨買賣

        </button>


    </div>


    <select
        id="topSelect"
    >

        <option value="10">
            TOP 10
        </option>

        <option value="20">
            TOP 20
        </option>

        <option value="50">
            TOP 50
        </option>

        <option value="100">
            TOP 100
        </option>

    </select>

</div>


<!-- =====================================================
     Summary
===================================================== -->

<div
    class="summary"
    id="summary"
>

    正在載入外資資料...

</div>


<!-- =====================================================
     表格
===================================================== -->

<div class="table-wrapper">


<table>


<thead>

<tr>

    <th>
        Rank
    </th>

    <th>
        股票代號
    </th>

    <th>
        股票名稱
    </th>

    <th>
        收盤價
    </th>

    <th>
        外資淨買賣
    </th>

</tr>

</thead>


<tbody
    id="tableBody"
>


<tr>

    <td
        colspan="5"
        class="loading"
    >

        正在載入資料...

    </td>

</tr>


</tbody>


</table>


</div>


</div>


<script>


// ========================================================
// 全域
// ========================================================

let foreignData = [];

let currentType = "buy";

let topN = 10;


// ========================================================
// 數字
// ========================================================

function toNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return 0;

    }


    const n =
        Number(
            String(value)
                .replace(/,/g, "")
                .trim()
        );


    return Number.isFinite(n)
        ? n
        : 0;

}


// ========================================================
// 金額格式
// ========================================================

function formatMoney(value) {

    const number =
        toNumber(value);


    if (
        number === 0
    ) {

        return "0";

    }


    const abs =
        Math.abs(number);


    if (
        abs >= 100000000
    ) {

        return (

            (number / 100000000)
                .toFixed(2)

            + " 億"

        );

    }


    if (
        abs >= 10000
    ) {

        return (

            (number / 10000)
                .toFixed(0)

            + " 萬"

        );

    }


    return number.toLocaleString(
        "zh-TW"
    );

}


// ========================================================
// 股價格式
// ========================================================

function formatPrice(value) {

    const number =
        toNumber(value);


    if (
        !Number.isFinite(number)
    ) {

        return "-";

    }


    return number.toLocaleString(
        "zh-TW",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}


// ========================================================
// 取得外資金額
//
// 你的 money_rank.json:
// foreign
//   └── foreign_money
// ========================================================

function getForeignMoney(item) {

    return toNumber(
        item.foreign_money
    );

}


// ========================================================
// 取得股票代號
// ========================================================

function getStockId(item) {

    return String(

        item.stock_id ??
        ""

    ).trim();

}


// ========================================================
// 取得股票名稱
// ========================================================

function getStockName(item) {

    return String(

        item.stock_name ??
        ""

    ).trim();

}


// ========================================================
// 買超
// ========================================================

function getBuyRows() {

    return foreignData

        .filter(
            item =>
                getForeignMoney(item) > 0
        )

        .sort(
            (a, b) =>
                getForeignMoney(b)
                -
                getForeignMoney(a)
        );

}


// ========================================================
// 賣超
// ========================================================

function getSellRows() {

    return foreignData

        .filter(
            item =>
                getForeignMoney(item) < 0
        )

        .sort(
            (a, b) =>
                getForeignMoney(a)
                -
                getForeignMoney(b)
        );

}


// ========================================================
// 淨買賣
//
// 由最大買超一路排到最大賣超
// ========================================================

function getNetRows() {

    return [
        ...foreignData
    ]

    .sort(
        (a, b) =>
            getForeignMoney(b)
            -
            getForeignMoney(a)
    );

}


// ========================================================
// 目前模式資料
// ========================================================

function getCurrentRows() {

    if (
        currentType === "buy"
    ) {

        return getBuyRows();

    }


    if (
        currentType === "sell"
    ) {

        return getSellRows();

    }


    return getNetRows();

}


// ========================================================
// 模式名稱
// ========================================================

function getModeName() {

    if (
        currentType === "buy"
    ) {

        return "外資買超";

    }


    if (
        currentType === "sell"
    ) {

        return "外資賣超";

    }


    return "外資淨買賣";

}


// ========================================================
// 顯示表格
// ========================================================

function renderTable() {

    const tableBody =
        document.getElementById(
            "tableBody"
        );


    const summary =
        document.getElementById(
            "summary"
        );


    tableBody.innerHTML = "";


    // ----------------------------------------------------
    // 取得目前模式
    // ----------------------------------------------------

    const sortedRows =
        getCurrentRows();


    // ----------------------------------------------------
    // TOP
    // ----------------------------------------------------

    const rows =
        sortedRows.slice(
            0,
            topN
        );


    // ----------------------------------------------------
    // Summary
    // ----------------------------------------------------

    summary.textContent =

        `${getModeName()}｜`
        +
        `共 ${sortedRows.length} 筆｜`
        +
        `顯示 TOP ${rows.length}`;


    // ----------------------------------------------------
    // 沒資料
    // ----------------------------------------------------

    if (
        rows.length === 0
    ) {

        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="loading"
                >

                    目前沒有符合條件的資料。

                </td>

            </tr>

        `;

        return;

    }


    // ----------------------------------------------------
    // 建立表格
    // ----------------------------------------------------

    rows.forEach(
        (
            item,
            index
        ) => {


            const money =
                getForeignMoney(
                    item
                );


            let moneyClass =
                "money-zero";


            if (
                money > 0
            ) {

                moneyClass =
                    "money-positive";

            }


            else if (
                money < 0
            ) {

                moneyClass =
                    "money-negative";

            }


            let displayMoney =
                formatMoney(
                    money
                );


            if (
                money > 0
            ) {

                displayMoney =
                    "+"
                    +
                    displayMoney;

            }


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td class="rank">

                    ${index + 1}

                </td>


                <td class="stock-id">

                    ${
                        getStockId(item)
                        || "-"
                    }

                </td>


                <td>

                    ${
                        getStockName(item)
                        || "-"
                    }

                </td>


                <td>

                    ${
                        formatPrice(
                            item.close_price
                        )
                    }

                </td>


                <td
                    class="${moneyClass}"
                >

                    ${displayMoney}

                </td>

            `;


            tableBody.appendChild(
                row
            );

        }
    );

}


// ========================================================
// 載入 JSON
// ========================================================

async function loadData() {

    const tableBody =
        document.getElementById(
            "tableBody"
        );


    try {


        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="loading"
                >

                    正在載入外資資料...

                </td>

            </tr>

        `;


        // ------------------------------------------------
        // 直接讀 money_rank.json
        // ------------------------------------------------

        const response =
            await fetch(
                "money_rank.json?ts="
                +
                Date.now()
            );


        if (
            !response.ok
        ) {

            throw new Error(

                "money_rank.json 載入失敗：HTTP "
                +
                response.status

            );

        }


        const data =
            await response.json();


        console.log(
            "money_rank.json：",
            data
        );


        // ------------------------------------------------
        // 日期
        // ------------------------------------------------

        document
            .getElementById(
                "dataDate"
            )
            .textContent =

            "資料日期："
            +
            (
                data.data_date
                ??
                "-"
            );


        // ------------------------------------------------
        // foreign
        // ------------------------------------------------

        if (
            !Array.isArray(
                data.foreign
            )
        ) {

            throw new Error(
                "money_rank.json 找不到 foreign 資料"
            );

        }


        foreignData =
            data.foreign.map(
                item => ({

                    stock_id:
                        item.stock_id,

                    stock_name:
                        item.stock_name,

                    close_price:
                        item.close_price,

                    foreign_money:
                        toNumber(
                            item.foreign_money
                        ),

                    rank:
                        item.rank

                })
            );


        console.log(
            "foreign 資料筆數：",
            foreignData.length
        );


        // ------------------------------------------------
        // 計算買超 / 賣超數量
        // ------------------------------------------------

        const buyCount =
            foreignData.filter(
                item =>
                    getForeignMoney(item) > 0
            ).length;


        const sellCount =
            foreignData.filter(
                item =>
                    getForeignMoney(item) < 0
            ).length;


        console.log(
            "買超筆數：",
            buyCount
        );


        console.log(
            "賣超筆數：",
            sellCount
        );


        // ------------------------------------------------
        // 顯示
        // ------------------------------------------------

        renderTable();


    }
    catch (error) {


        console.error(
            "外資資料錯誤：",
            error
        );


        document
            .getElementById(
                "dataDate"
            )
            .textContent =
            "資料載入失敗";


        document
            .getElementById(
                "summary"
            )
            .textContent =
            error.message;


        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="5"
                >

                    <div class="error">

                        <strong>
                            ❌ 無法載入外資資料
                        </strong>

                        <br><br>

                        ${error.message}

                        <br><br>

                        請確認
                        <strong>
                            money_rank.json
                        </strong>
                        存在於網站根目錄。

                    </div>

                </td>

            </tr>

        `;

    }

}


// ========================================================
// 三個按鈕
// ========================================================

document
    .querySelectorAll(
        ".tab"
    )
    .forEach(
        button => {


            button.addEventListener(
                "click",
                function() {


                    // ------------------------------------
                    // 移除所有 active
                    // ------------------------------------

                    document
                        .querySelectorAll(
                            ".tab"
                        )
                        .forEach(
                            btn =>
                                btn.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    // ------------------------------------
                    // 目前按鈕 active
                    // ------------------------------------

                    this.classList.add(
                        "active"
                    );


                    // ------------------------------------
                    // 更新模式
                    // ------------------------------------

                    currentType =
                        this.dataset.type;


                    // ------------------------------------
                    // 重新排序
                    // ------------------------------------

                    renderTable();

                }
            );

        }
    );


// ========================================================
// TOP
// ========================================================

document
    .getElementById(
        "topSelect"
    )
    .addEventListener(
        "change",
        function() {

            topN =
                Number(
                    this.value
                );

            renderTable();

        }
    );


// ========================================================
// 啟動
// ========================================================

loadData();

</script>


</body>

</html>
