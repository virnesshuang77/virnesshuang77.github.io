<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Trading</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
    background: #f5f7fa;
    color: #111827;
}

.container {
    width: min(1100px, calc(100% - 24px));
    margin: 0 auto;
    padding: 28px 0 60px;
}

/* =========================
   Header
========================= */

.header {
    background: #111827;
    color: #fff;
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 18px;
}

.header h1 {
    margin: 0 0 5px;
    font-size: 30px;
}

.header p {
    margin: 0;
    color: #d1d5db;
    font-size: 15px;
}

/* =========================
   Summary
========================= */

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}

.summary-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 13px;
    padding: 17px;
}

.summary-label {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 4px;
}

.summary-value {
    font-size: 25px;
    font-weight: 800;
}

/* =========================
   Date
========================= */

.date-box {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 13px;
    padding: 15px 18px;
    margin-bottom: 18px;
    color: #374151;
}

.date-box strong {
    color: #111827;
}

/* =========================
   Section
========================= */

.section {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 22px;
}

.section-title {
    margin: 0 0 18px;
    font-size: 22px;
}

/* =========================
   Stock list
========================= */

.stock-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.stock-row {
    display: grid;
    grid-template-columns: 70px 120px 1fr 150px 120px;
    align-items: center;
    gap: 15px;

    min-height: 72px;

    border: 1px solid #e5e7eb;
    border-radius: 12px;

    padding: 12px 18px;

    background: #fff;

    transition: transform .15s ease,
                box-shadow .15s ease;
}

.stock-row:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(0,0,0,.06);
}

/* =========================
   Rank
========================= */

.rank {
    font-size: 20px;
    font-weight: 800;
    color: #6b7280;
}

.rank.top {
    color: #111827;
}

/* =========================
   Symbol
========================= */

.symbol {
    font-size: 17px;
    font-weight: 800;
    color: #374151;
}

/* =========================
   Name
========================= */

.name {
    font-size: 19px;
    font-weight: 800;
    color: #111827;
}

/* =========================
   Price
========================= */

.price {
    text-align: right;
    font-size: 18px;
    font-weight: 700;
}

/* =========================
   Change
========================= */

.change {
    text-align: right;
    font-weight: 700;
}

.up {
    color: #dc2626;
}

.down {
    color: #15803d;
}

.flat {
    color: #6b7280;
}

/* =========================
   Empty
========================= */

.empty {
    text-align: center;
    padding: 55px 20px;
    color: #6b7280;
}

.empty-title {
    font-size: 21px;
    font-weight: 800;
    color: #111827;
    margin-bottom: 7px;
}

/* =========================
   Loading
========================= */

.loading {
    text-align: center;
    padding: 45px;
    color: #6b7280;
}

/* =========================
   Error
========================= */

.error {
    padding: 20px;
    border-radius: 12px;
    background: #fff;
    border: 1px solid #fecaca;
    color: #b91c1c;
}

/* =========================
   Footer
========================= */

.footer {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    margin-top: 25px;
}

/* =========================
   Mobile
========================= */

@media (max-width: 700px) {

    .container {
        width: calc(100% - 16px);
        padding-top: 15px;
    }

    .header {
        padding: 23px 20px;
    }

    .header h1 {
        font-size: 26px;
    }

    .summary {
        grid-template-columns: 1fr;
    }

    .section {
        padding: 15px;
    }

    .stock-row {
        grid-template-columns: 42px 75px 1fr;
        gap: 7px 10px;
        padding: 13px 12px;
    }

    .rank {
        grid-row: span 2;
    }

    .symbol {
        font-size: 14px;
    }

    .name {
        font-size: 17px;
    }

    .price {
        text-align: left;
        font-size: 16px;
    }

    .change {
        text-align: left;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- =========================
         Header
    ========================== -->

    <header class="header">
        <h1>🤖 AI Trading</h1>
        <p>
            ChatGPT 台股選股實驗
        </p>
    </header>


    <!-- =========================
         Summary
    ========================== -->

    <div class="summary">

        <div class="summary-card">
            <div class="summary-label">
                今日熱門股票
            </div>

            <div
                class="summary-value"
                id="totalStocks">
                -
            </div>
        </div>


        <div class="summary-card">
            <div class="summary-label">
                通過篩選
            </div>

            <div
                class="summary-value"
                id="candidateStocks">
                -
            </div>
        </div>


        <div class="summary-card">
            <div class="summary-label">
                今日最終標的
            </div>

            <div
                class="summary-value"
                id="finalStocks">
                -
            </div>
        </div>

    </div>


    <!-- =========================
         Date
    ========================== -->

    <div class="date-box">

        資料日期：
        <strong id="dataDate">-</strong>

        <span style="margin-left:15px;">
            AI 最後篩選：最多 5 檔
        </span>

    </div>


    <!-- =========================
         Final stocks
    ========================== -->

    <section class="section">

        <h2 class="section-title">
            🎯 今日 AI 選股
        </h2>

        <div
            id="stockList"
            class="stock-list">

            <div class="loading">
                正在讀取資料...
            </div>

        </div>

    </section>


    <div class="footer">
        AI Trading Experiment
    </div>

</div>


<script>

/* =========================================================
   JSON
========================================================= */

const TOP100_URL = "tw_top100.json";
const FUNDAMENTALS_URL = "tw_fundamentals.json";

const MAX_STOCKS = 5;


/* =========================================================
   工具
========================================================= */

function number(value) {

    const n = Number(value);

    return Number.isFinite(n)
        ? n
        : null;
}


function percent(value) {

    const n = number(value);

    if (n === null) {
        return "--";
    }

    const sign =
        n > 0
            ? "+"
            : "";

    return sign +
        n.toFixed(2) +
        "%";
}


function formatPrice(value) {

    const n = number(value);

    if (n === null) {
        return "--";
    }

    return n.toLocaleString(
        "zh-TW",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );
}


/* =========================================================
   基本面分數
========================================================= */

function fundamentalScore(f) {

    let score = 0;

    const revenueYoY =
        number(f.quarter_revenue_yoy);

    const grossMargin =
        number(f.quarter_gross_margin);

    const operatingMargin =
        number(f.quarter_operating_margin);

    const eps =
        number(f.quarter_eps);

    const epsYoY =
        number(f.quarter_eps_yoy);

    const roe =
        number(f.roe_ttm);

    const debtRatio =
        number(f.debt_ratio);

    const currentRatio =
        number(f.current_ratio);


    /* 營收 */

    if (revenueYoY !== null) {

        if (revenueYoY > 20) {
            score += 3;
        }
        else if (revenueYoY > 5) {
            score += 2;
        }
        else if (revenueYoY >= 0) {
            score += 1;
        }
    }


    /* 毛利率 */

    if (grossMargin !== null) {

        if (grossMargin > 30) {
            score += 2;
        }
        else if (grossMargin > 15) {
            score += 1;
        }
    }


    /* 營業利益率 */

    if (operatingMargin !== null) {

        if (operatingMargin > 15) {
            score += 3;
        }
        else if (operatingMargin > 5) {
            score += 2;
        }
        else if (operatingMargin > 0) {
            score += 1;
        }
    }


    /* EPS */

    if (eps !== null && eps > 0) {
        score += 3;
    }


    /* EPS 成長 */

    if (epsYoY !== null) {

        if (epsYoY > 20) {
            score += 3;
        }
        else if (epsYoY > 0) {
            score += 2;
        }
    }


    /* ROE */

    if (roe !== null) {

        if (roe > 20) {
            score += 3;
        }
        else if (roe > 10) {
            score += 2;
        }
        else if (roe > 0) {
            score += 1;
        }
    }


    /* 負債 */

    if (debtRatio !== null) {

        if (debtRatio < 50) {
            score += 2;
        }
        else if (debtRatio < 70) {
            score += 1;
        }
    }


    /* 流動比 */

    if (currentRatio !== null) {

        if (currentRatio >= 1.5) {
            score += 2;
        }
        else if (currentRatio >= 1) {
            score += 1;
        }
    }


    return score;
}


/* =========================================================
   基本面淘汰
========================================================= */

function fundamentalRejected(f) {

    const eps =
        number(f.quarter_eps);

    const operatingIncome =
        number(f.quarter_operating_income);

    const revenueYoY =
        number(f.quarter_revenue_yoy);

    const roe =
        number(f.roe_ttm);

    const debtRatio =
        number(f.debt_ratio);


    /*
        EPS 負 + 營業利益負
    */

    if (
        eps !== null &&
        operatingIncome !== null &&
        eps < 0 &&
        operatingIncome <= 0
    ) {
        return true;
    }


    /*
        營收大幅衰退 + EPS 負
    */

    if (
        revenueYoY !== null &&
        eps !== null &&
        revenueYoY < -30 &&
        eps < 0
    ) {
        return true;
    }


    /*
        ROE 嚴重負值
    */

    if (
        roe !== null &&
        roe < -10
    ) {
        return true;
    }


    /*
        負債比例過高
    */

    if (
        debtRatio !== null &&
        debtRatio > 85
    ) {
        return true;
    }


    return false;
}


/* =========================================================
   技術面分數
========================================================= */

function technicalScore(s) {

    let score = 0;

    const close =
        number(s.close);

    const ma5 =
        number(s.ma5);

    const ma20 =
        number(s.ma20);

    const ma60 =
        number(s.ma60);

    const ma120 =
        number(s.ma120);

    const return5 =
        number(s.return_5d);

    const return20 =
        number(s.return_20d);

    const return60 =
        number(s.return_60d);

    const volumeRatio =
        number(s.volume_ratio_20d);


    /* 股價 > MA5 */

    if (
        close !== null &&
        ma5 !== null &&
        close > ma5
    ) {
        score += 1;
    }


    /* 股價 > MA20 */

    if (
        close !== null &&
        ma20 !== null &&
        close > ma20
    ) {
        score += 2;
    }


    /* 股價 > MA60 */

    if (
        close !== null &&
        ma60 !== null &&
        close > ma60
    ) {
        score += 2;
    }


    /* 股價 > MA120 */

    if (
        close !== null &&
        ma120 !== null &&
        close > ma120
    ) {
        score += 1;
    }


    /* MA5 > MA20 */

    if (
        ma5 !== null &&
        ma20 !== null &&
        ma5 > ma20
    ) {
        score += 2;
    }


    /* MA20 > MA60 */

    if (
        ma20 !== null &&
        ma60 !== null &&
        ma20 > ma60
    ) {
        score += 2;
    }


    /* 20日正報酬 */

    if (
        return20 !== null &&
        return20 > 0
    ) {
        score += 2;
    }


    /* 60日正報酬 */

    if (
        return60 !== null &&
        return60 > 0
    ) {
        score += 2;
    }


    /* 成交量增加 */

    if (
        volumeRatio !== null &&
        volumeRatio >= 1.2
    ) {
        score += 2;
    }


    /*
        短線超跌但中期仍強
    */

    if (
        return5 !== null &&
        return60 !== null &&
        return5 < -8 &&
        return60 > 0
    ) {
        score += 2;
    }


    return score;
}


/* =========================================================
   建立候選
========================================================= */

function buildCandidates(
    stocks,
    fundamentals
) {

    const fundamentalMap =
        new Map();


    fundamentals.forEach(f => {

        if (!f.symbol) {
            return;
        }

        fundamentalMap.set(
            String(f.symbol),
            f
        );

    });


    const candidates = [];


    stocks.forEach(stock => {

        const symbol =
            String(stock.symbol);

        const f =
            fundamentalMap.get(symbol);


        /*
            沒有基本面
        */

        if (!f) {
            return;
        }


        /*
            基本面淘汰
        */

        if (
            fundamentalRejected(f)
        ) {
            return;
        }


        const fs =
            fundamentalScore(f);

        const ts =
            technicalScore(stock);


        /*
            基本面最低門檻

            防止純題材、
            基本面太差的股票進來。
        */

        if (fs < 7) {
            return;
        }


        /*
            技術面最低門檻
        */

        if (ts < 4) {
            return;
        }


        /*
            綜合分數

            基本面稍微提高權重。
        */

        const totalScore =
            fs * 1.2 +
            ts;


        candidates.push({

            ...stock,

            fundamental: f,

            fundamentalScore: fs,

            technicalScore: ts,

            totalScore

        });

    });


    /*
        排名
    */

    candidates.sort(
        (a, b) =>
            b.totalScore -
            a.totalScore
    );


    return candidates;
}


/* =========================================================
   Render
========================================================= */

function renderStock(
    stock,
    rank
) {

    const change =
        number(stock.change_percent);


    let changeClass = "flat";

    if (change > 0) {
        changeClass = "up";
    }
    else if (change < 0) {
        changeClass = "down";
    }


    return `

        <div class="stock-row">

            <div
                class="rank ${rank <= 3 ? "top" : ""}">
                #${rank}
            </div>


            <div class="symbol">
                ${stock.symbol}
            </div>


            <div class="name">
                ${stock.name || "--"}
            </div>


            <div class="price">
                ${formatPrice(stock.close)}
            </div>


            <div
                class="change ${changeClass}">
                ${percent(stock.change_percent)}
            </div>

        </div>

    `;
}


/* =========================================================
   載入資料
========================================================= */

async function loadData() {

    const stockList =
        document.getElementById(
            "stockList"
        );


    try {

        const [
            top100Response,
            fundamentalsResponse
        ] = await Promise.all([

            fetch(
                TOP100_URL +
                "?t=" +
                Date.now()
            ),

            fetch(
                FUNDAMENTALS_URL +
                "?t=" +
                Date.now()
            )

        ]);


        if (!top100Response.ok) {

            throw new Error(
                "tw_top100.json 載入失敗"
            );

        }


        if (!fundamentalsResponse.ok) {

            throw new Error(
                "tw_fundamentals.json 載入失敗"
            );

        }


        const top100 =
            await top100Response.json();


        const fundamentalData =
            await fundamentalsResponse.json();


        const stocks =
            Array.isArray(top100.stocks)
                ? top100.stocks
                : [];


        const fundamentals =
            Array.isArray(
                fundamentalData.stocks
            )
                ? fundamentalData.stocks
                : [];


        /*
            日期
        */

        document.getElementById(
            "dataDate"
        ).textContent =
            top100.date || "--";


        /*
            Top 100
        */

        document.getElementById(
            "totalStocks"
        ).textContent =
            stocks.length;


        /*
            建立候選
        */

        const candidates =
            buildCandidates(
                stocks,
                fundamentals
            );


        document.getElementById(
            "candidateStocks"
        ).textContent =
            candidates.length;


        /*
            最多 5 檔
        */

        const finalStocks =
            candidates.slice(
                0,
                MAX_STOCKS
            );


        document.getElementById(
            "finalStocks"
        ).textContent =
            finalStocks.length;


        /*
            沒有股票
        */

        if (
            finalStocks.length === 0
        ) {

            stockList.innerHTML = `

                <div class="empty">

                    <div class="empty-title">
                        今日 0 檔
                    </div>

                    今天沒有足夠符合目前
                    篩選條件的股票。

                </div>

            `;

            return;
        }


        /*
            顯示
        */

        stockList.innerHTML =
            finalStocks
                .map(
                    (stock, index) =>
                        renderStock(
                            stock,
                            index + 1
                        )
                )
                .join("");


    }
    catch (error) {

        console.error(error);


        stockList.innerHTML = `

            <div class="error">

                <strong>
                    資料讀取失敗
                </strong>

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


/* =========================================================
   啟動
========================================================= */

loadData();

</script>

</body>
</html>
