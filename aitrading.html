<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Trading</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
    background: #f5f7fa;
    color: #1f2937;
}

.container {
    width: min(1200px, calc(100% - 28px));
    margin: 0 auto;
    padding: 28px 0 60px;
}

/* =========================
   Header
========================= */

.header {
    background: #111827;
    color: white;
    border-radius: 18px;
    padding: 30px 28px;
    margin-bottom: 18px;
}

.header h1 {
    margin: 0 0 6px;
    font-size: 30px;
}

.header p {
    margin: 0;
    color: #d1d5db;
}

/* =========================
   Summary
========================= */

.summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}

.summary-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 18px;
}

.summary-label {
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 4px;
}

.summary-value {
    font-size: 25px;
    font-weight: 800;
    color: #111827;
}

/* =========================
   Notice
========================= */

.notice {
    background: white;
    border: 1px solid #e5e7eb;
    border-left: 5px solid #374151;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 18px;
    line-height: 1.7;
}

/* =========================
   Main
========================= */

.section {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
}

.section-title {
    margin: 0 0 16px;
    font-size: 22px;
    color: #111827;
}

/* =========================
   Stock Cards
========================= */

.stock-list {
    display: grid;
    gap: 14px;
}

.stock-card {
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 20px;
    background: #fff;
}

.stock-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
}

.stock-name {
    font-size: 21px;
    font-weight: 800;
    color: #111827;
}

.stock-symbol {
    color: #6b7280;
    font-size: 14px;
    margin-left: 6px;
}

.stock-rank {
    font-size: 13px;
    font-weight: 700;
    color: #6b7280;
    white-space: nowrap;
}

.stock-price {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 700;
}

.stock-change {
    font-size: 14px;
    margin-left: 8px;
}

.positive {
    color: #15803d;
}

.negative {
    color: #dc2626;
}

.neutral {
    color: #6b7280;
}

/* =========================
   Tags
========================= */

.tags {
    margin-top: 14px;
}

.tag {
    display: inline-block;
    padding: 4px 9px;
    margin: 3px 4px 3px 0;
    border-radius: 999px;
    background: #f3f4f6;
    color: #374151;
    font-size: 12px;
    font-weight: 700;
}

/* =========================
   Metrics
========================= */

.metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 16px;
}

.metric {
    background: #f9fafb;
    border: 1px solid #eef0f2;
    border-radius: 10px;
    padding: 10px;
}

.metric-label {
    font-size: 12px;
    color: #6b7280;
}

.metric-value {
    margin-top: 2px;
    font-size: 15px;
    font-weight: 700;
    color: #111827;
}

/* =========================
   Reason
========================= */

.reason {
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
}

.reason-title {
    font-weight: 800;
    margin-bottom: 6px;
    color: #111827;
}

.reason ul {
    margin: 6px 0 0;
    padding-left: 20px;
}

.reason li {
    margin-bottom: 4px;
}

/* =========================
   Empty
========================= */

.empty {
    text-align: center;
    padding: 45px 20px;
    color: #6b7280;
}

.empty strong {
    display: block;
    color: #111827;
    font-size: 20px;
    margin-bottom: 6px;
}

/* =========================
   Loading / Error
========================= */

.loading {
    text-align: center;
    padding: 40px;
    color: #6b7280;
}

.error {
    background: #fff;
    border: 1px solid #fecaca;
    color: #b91c1c;
    padding: 18px;
    border-radius: 12px;
}

/* =========================
   Footer
========================= */

.footer {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    margin-top: 28px;
}

/* =========================
   Mobile
========================= */

@media (max-width: 800px) {

    .summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .metrics {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {

    .container {
        width: calc(100% - 18px);
        padding-top: 15px;
    }

    .header {
        padding: 24px 20px;
        border-radius: 14px;
    }

    .header h1 {
        font-size: 26px;
    }

    .section {
        padding: 17px;
    }

    .stock-card {
        padding: 16px;
    }

    .stock-name {
        font-size: 19px;
    }

    .metrics {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- =========================
         Header
    ========================== -->

    <header class="header">
        <h1>🤖 AI Trading</h1>
        <p>
            ChatGPT 台股選股實驗｜熱門 → 基本面 → 技術面
        </p>
    </header>

    <!-- =========================
         Summary
    ========================== -->

    <div class="summary">

        <div class="summary-card">
            <div class="summary-label">熱門股票</div>
            <div class="summary-value" id="totalStocks">-</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">基本面可用</div>
            <div class="summary-value" id="fundamentalStocks">-</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">進入研究池</div>
            <div class="summary-value" id="researchStocks">-</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">最終標的</div>
            <div class="summary-value" id="finalStocks">-</div>
        </div>

    </div>

    <!-- =========================
         Notice
    ========================== -->

    <div class="notice">
        <strong>今日選股邏輯</strong><br>
        先從當日成交金額 Top 100 開始，
        再檢查基本面與技術面。
        本頁目前尚未加入新聞／題材自動分析，
        因此不會假裝有題材判斷。
        最後最多留下 5 檔；如果沒有足夠好的機會，也可以是 0 檔。
    </div>

    <!-- =========================
         Final Stocks
    ========================== -->

    <section class="section">

        <h2 class="section-title">
            🎯 今日值得關注的標的
        </h2>

        <div id="stockList" class="stock-list">
            <div class="loading">
                正在讀取市場資料...
            </div>
        </div>

    </section>

    <div class="footer">
        AI Trading Experiment · Data-driven public experiment
    </div>

</div>

<script>

/* =========================================================
   基本設定
========================================================= */

const TOP100_URL = "tw_top100.json";
const FUNDAMENTALS_URL = "tw_fundamentals.json";

/*
    最多留下幾檔
*/
const MAX_STOCKS = 5;


/* =========================================================
   工具
========================================================= */

function num(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n : null;
}

function pct(value) {
    const n = num(value);

    if (n === null) {
        return "--";
    }

    const sign = n > 0 ? "+" : "";
    return sign + n.toFixed(2) + "%";
}

function price(value) {
    const n = num(value);

    if (n === null) {
        return "--";
    }

    return n.toLocaleString("zh-TW", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function getChangeClass(value) {

    const n = num(value);

    if (n === null) {
        return "neutral";
    }

    if (n > 0) {
        return "positive";
    }

    if (n < 0) {
        return "negative";
    }

    return "neutral";
}


/* =========================================================
   基本面判斷
========================================================= */

function fundamentalScore(f) {

    let score = 0;

    const revenueYoY = num(f.quarter_revenue_yoy);
    const grossMargin = num(f.quarter_gross_margin);
    const operatingMargin = num(f.quarter_operating_margin);
    const netMargin = num(f.quarter_net_margin);
    const eps = num(f.quarter_eps);
    const epsYoY = num(f.quarter_eps_yoy);
    const roe = num(f.roe_ttm);
    const debtRatio = num(f.debt_ratio);
    const currentRatio = num(f.current_ratio);

    /*
        營收
    */

    if (revenueYoY !== null) {

        if (revenueYoY > 20) {
            score += 3;
        }
        else if (revenueYoY > 5) {
            score += 2;
        }
        else if (revenueYoY >= 0) {
            score += 1;
        }
    }

    /*
        毛利率
    */

    if (grossMargin !== null) {

        if (grossMargin > 30) {
            score += 2;
        }
        else if (grossMargin > 15) {
            score += 1;
        }
    }

    /*
        營業利益率
    */

    if (operatingMargin !== null) {

        if (operatingMargin > 15) {
            score += 3;
        }
        else if (operatingMargin > 5) {
            score += 2;
        }
        else if (operatingMargin > 0) {
            score += 1;
        }
    }

    /*
        EPS
    */

    if (eps !== null) {

        if (eps > 0) {
            score += 3;
        }
    }

    /*
        EPS 成長
    */

    if (epsYoY !== null) {

        if (epsYoY > 20) {
            score += 3;
        }
        else if (epsYoY > 0) {
            score += 2;
        }
    }

    /*
        ROE
    */

    if (roe !== null) {

        if (roe > 20) {
            score += 3;
        }
        else if (roe > 10) {
            score += 2;
        }
        else if (roe > 0) {
            score += 1;
        }
    }

    /*
        負債比
    */

    if (debtRatio !== null) {

        if (debtRatio < 50) {
            score += 2;
        }
        else if (debtRatio < 70) {
            score += 1;
        }
    }

    /*
        流動比
    */

    if (currentRatio !== null) {

        if (currentRatio >= 1.5) {
            score += 2;
        }
        else if (currentRatio >= 1) {
            score += 1;
        }
    }

    return score;
}


/* =========================================================
   基本面硬性淘汰
========================================================= */

function fundamentalRejected(f) {

    const eps = num(f.quarter_eps);
    const operatingIncome = num(f.quarter_operating_income);
    const revenueYoY = num(f.quarter_revenue_yoy);
    const roe = num(f.roe_ttm);
    const debtRatio = num(f.debt_ratio);

    /*
        明顯虧損：
        EPS < 0 且營業利益也 <= 0
    */

    if (
        eps !== null &&
        operatingIncome !== null &&
        eps < 0 &&
        operatingIncome <= 0
    ) {
        return true;
    }

    /*
        營收與獲利同時明顯惡化
    */

    if (
        revenueYoY !== null &&
        eps !== null &&
        revenueYoY < -30 &&
        eps < 0
    ) {
        return true;
    }

    /*
        ROE 嚴重負值
    */

    if (
        roe !== null &&
        roe < -10
    ) {
        return true;
    }

    /*
        負債非常高
    */

    if (
        debtRatio !== null &&
        debtRatio > 85
    ) {
        return true;
    }

    return false;
}


/* =========================================================
   技術面
========================================================= */

function technicalScore(s) {

    let score = 0;

    const close = num(s.close);
    const ma5 = num(s.ma5);
    const ma20 = num(s.ma20);
    const ma60 = num(s.ma60);
    const ma120 = num(s.ma120);

    const return5 = num(s.return_5d);
    const return20 = num(s.return_20d);
    const return60 = num(s.return_60d);

    const volumeRatio = num(s.volume_ratio_20d);

    /*
        股價站上 MA
    */

    if (
        close !== null &&
        ma5 !== null &&
        close > ma5
    ) {
        score += 1;
    }

    if (
        close !== null &&
        ma20 !== null &&
        close > ma20
    ) {
        score += 2;
    }

    if (
        close !== null &&
        ma60 !== null &&
        close > ma60
    ) {
        score += 2;
    }

    if (
        close !== null &&
        ma120 !== null &&
        close > ma120
    ) {
        score += 1;
    }

    /*
        均線排列
    */

    if (
        ma5 !== null &&
        ma20 !== null &&
        ma5 > ma20
    ) {
        score += 2;
    }

    if (
        ma20 !== null &&
        ma60 !== null &&
        ma20 > ma60
    ) {
        score += 2;
    }

    /*
        中期趨勢
    */

    if (
        return20 !== null &&
        return20 > 0
    ) {
        score += 2;
    }

    if (
        return60 !== null &&
        return60 > 0
    ) {
        score += 2;
    }

    /*
        成交量
    */

    if (
        volumeRatio !== null &&
        volumeRatio >= 1.2
    ) {
        score += 2;
    }

    /*
        超跌反轉：
        不能因為跌深直接淘汰。

        如果 5 日跌很多，
        但 60 日仍然為正，
        給予少量機會分。
    */

    if (
        return5 !== null &&
        return60 !== null &&
        return5 < -8 &&
        return60 > 0
    ) {
        score += 2;
    }

    return score;
}


/* =========================================================
   技術面描述
========================================================= */

function getTechnicalTags(s) {

    const tags = [];

    const close = num(s.close);
    const ma5 = num(s.ma5);
    const ma20 = num(s.ma20);
    const ma60 = num(s.ma60);

    const return5 = num(s.return_5d);
    const return20 = num(s.return_20d);
    const return60 = num(s.return_60d);

    if (
        close !== null &&
        ma10Safe(s)
    ) {
        tags.push("短線轉強");
    }

    if (
        close !== null &&
        ma20 !== null &&
        close > ma20
    ) {
        tags.push("站上MA20");
    }

    if (
        ma20 !== null &&
        ma60 !== null &&
        ma20 > ma60
    ) {
        tags.push("MA20 > MA60");
    }

    if (
        return5 !== null &&
        return5 < -8 &&
        return60 !== null &&
        return60 > 0
    ) {
        tags.push("短線超跌");
    }

    if (
        return20 !== null &&
        return20 > 10
    ) {
        tags.push("20日強勢");
    }

    if (
        return60 !== null &&
        return60 > 20
    ) {
        tags.push("中期強勢");
    }

    return tags;
}

function ma10Safe(s) {

    /*
        目前 JSON 有 MA5 / MA20，
        沒有 MA10。
        因此不能假裝有 MA10。

        這裡使用 MA5 > MA20
        作為短線轉強的替代訊號。
    */

    const ma5 = num(s.ma5);
    const ma20 = num(s.ma20);

    if (
        ma5 === null ||
        ma20 === null
    ) {
        return false;
    }

    return ma5 > ma20;
}


/* =========================================================
   建立研究候選
========================================================= */

function buildCandidates(stocks, fundamentals) {

    const fundamentalMap = new Map();

    fundamentals.forEach(f => {

        if (!f.symbol) {
            return;
        }

        fundamentalMap.set(
            String(f.symbol),
            f
        );
    });

    const candidates = [];

    stocks.forEach(stock => {

        const symbol = String(stock.symbol);

        const f = fundamentalMap.get(symbol);

        /*
            沒有基本面資料：
            不進最終選股。
        */

        if (!f) {
            return;
        }

        /*
            基本面硬性淘汰
        */

        if (fundamentalRejected(f)) {
            return;
        }

        const fs = fundamentalScore(f);
        const ts = technicalScore(stock);

        /*
            綜合分數

            基本面權重稍高，
            技術面用來尋找進場位置。
        */

        const totalScore =
            fs * 1.2 +
            ts;

        /*
            最低基本面門檻

            不是要求基本面非常漂亮，
            但不能只是純題材垃圾股。
        */

        if (fs < 7) {
            return;
        }

        /*
            技術面至少需要有一些訊號。
        */

        if (ts < 4) {
            return;
        }

        candidates.push({

            ...stock,

            fundamental: f,

            fundamentalScore: fs,

            technicalScore: ts,

            totalScore: totalScore,

            technicalTags:
                getTechnicalTags(stock)

        });

    });

    /*
        綜合排名
    */

    candidates.sort(
        (a, b) =>
            b.totalScore -
            a.totalScore
    );

    return candidates;
}


/* =========================================================
   建立理由
========================================================= */

function buildReasons(stock) {

    const f = stock.fundamental;

    const reasons = [];

    const revenueYoY = num(f.quarter_revenue_yoy);
    const eps = num(f.quarter_eps);
    const roe = num(f.roe_ttm);

    const close = num(stock.close);
    const ma20 = num(stock.ma20);
    const return5 = num(stock.return_5d);
    const return20 = num(stock.return_20d);

    /*
        基本面
    */

    if (
        revenueYoY !== null &&
        revenueYoY > 10
    ) {
        reasons.push(
            `最新季度營收年增 ${pct(revenueYoY)}`
        );
    }

    if (
        eps !== null &&
        eps > 0
    ) {
        reasons.push(
            `最新季度 EPS ${eps.toFixed(2)}，仍為正`
        );
    }

    if (
        roe !== null &&
        roe > 10
    ) {
        reasons.push(
            `TTM ROE ${roe.toFixed(2)}%`
        );
    }

    /*
        技術面
    */

    if (
        close !== null &&
        ma20 !== null &&
        close > ma20
    ) {
        reasons.push(
            "股價站在 MA20 之上"
        );
    }

    if (
        return20 !== null &&
        return20 > 0
    ) {
        reasons.push(
            `20 日報酬 ${pct(return20)}`
        );
    }

    /*
        超跌
    */

    if (
        return5 !== null &&
        return5 < -8
    ) {
        reasons.push(
            `短期回檔 ${pct(return5)}，但未因此直接淘汰`
        );
    }

    /*
        沒有理由時
    */

    if (reasons.length === 0) {

        reasons.push(
            "基本面與技術面條件達到目前研究門檻"
        );
    }

    return reasons.slice(0, 5);
}


/* =========================================================
   Render
========================================================= */

function renderStock(stock, rank) {

    const f = stock.fundamental;

    const changeClass =
        getChangeClass(stock.change_percent);

    const reasons =
        buildReasons(stock);

    const tags =
        stock.technicalTags || [];

    return `

        <article class="stock-card">

            <div class="stock-top">

                <div>

                    <div class="stock-name">

                        ${stock.name || "未知股票"}

                        <span class="stock-symbol">
                            ${stock.symbol}
                        </span>

                    </div>

                    <div class="stock-price">

                        ${price(stock.close)}

                        <span class="stock-change ${changeClass}">
                            ${pct(stock.change_percent)}
                        </span>

                    </div>

                </div>

                <div class="stock-rank">
                    #${rank}
                </div>

            </div>


            <div class="tags">

                <span class="tag">
                    基本面 ${stock.fundamentalScore.toFixed(1)}
                </span>

                <span class="tag">
                    技術面 ${stock.technicalScore}
                </span>

                ${tags.map(tag => `
                    <span class="tag">
                        ${tag}
                    </span>
                `).join("")}

            </div>


            <div class="metrics">

                <div class="metric">
                    <div class="metric-label">
                        最新季度營收 YoY
                    </div>

                    <div class="metric-value">
                        ${pct(f.quarter_revenue_yoy)}
                    </div>
                </div>


                <div class="metric">
                    <div class="metric-label">
                        EPS
                    </div>

                    <div class="metric-value">
                        ${num(f.quarter_eps) !== null
                            ? num(f.quarter_eps).toFixed(2)
                            : "--"}
                    </div>
                </div>


                <div class="metric">
                    <div class="metric-label">
                        TTM ROE
                    </div>

                    <div class="metric-value">
                        ${pct(f.roe_ttm)}
                    </div>
                </div>


                <div class="metric">
                    <div class="metric-label">
                        20日報酬
                    </div>

                    <div class="metric-value">
                        ${pct(stock.return_20d)}
                    </div>
                </div>

            </div>


            <div class="reason">

                <div class="reason-title">
                    為什麼進入今日候選？
                </div>

                <ul>

                    ${reasons.map(reason => `
                        <li>${reason}</li>
                    `).join("")}

                </ul>

            </div>

        </article>

    `;
}


/* =========================================================
   Main
========================================================= */

async function loadData() {

    const stockList =
        document.getElementById("stockList");

    try {

        const [
            top100Response,
            fundamentalsResponse
        ] = await Promise.all([

            fetch(
                TOP100_URL +
                "?t=" +
                Date.now()
            ),

            fetch(
                FUNDAMENTALS_URL +
                "?t=" +
                Date.now()
            )

        ]);


        if (!top100Response.ok) {
            throw new Error(
                "tw_top100.json 載入失敗"
            );
        }

        if (!fundamentalsResponse.ok) {
            throw new Error(
                "tw_fundamentals.json 載入失敗"
            );
        }


        const top100 =
            await top100Response.json();

        const fundamentalsData =
            await fundamentalsResponse.json();


        const stocks =
            Array.isArray(top100.stocks)
                ? top100.stocks
                : [];


        const fundamentals =
            Array.isArray(fundamentalsData.stocks)
                ? fundamentalsData.stocks
                : [];


        /*
            Summary
        */

        document.getElementById(
            "totalStocks"
        ).textContent =
            stocks.length;


        document.getElementById(
            "fundamentalStocks"
        ).textContent =
            fundamentalsData.fundamental_count ??
            fundamentals.length;


        /*
            建立候選池
        */

        const candidates =
            buildCandidates(
                stocks,
                fundamentals
            );


        document.getElementById(
            "researchStocks"
        ).textContent =
            candidates.length;


        /*
            最多五檔
        */

        const finalStocks =
            candidates.slice(
                0,
                MAX_STOCKS
            );


        document.getElementById(
            "finalStocks"
        ).textContent =
            finalStocks.length;


        /*
            沒有標的
        */

        if (finalStocks.length === 0) {

            stockList.innerHTML = `

                <div class="empty">

                    <strong>
                        今日沒有符合條件的標的
                    </strong>

                    <div>
                        不為了湊滿 5 檔而強迫選股。
                        保留現金也是一種決策。
                    </div>

                </div>

            `;

            return;
        }


        /*
            顯示
        */

        stockList.innerHTML =
            finalStocks
                .map(
                    (stock, index) =>
                        renderStock(
                            stock,
                            index + 1
                        )
                )
                .join("");


    }
    catch (error) {

        console.error(error);

        stockList.innerHTML = `

            <div class="error">

                <strong>
                    資料讀取失敗
                </strong>

                <br>

                ${error.message}

                <br><br>

                請確認：
                <br>
                1. tw_top100.json 存在
                <br>
                2. tw_fundamentals.json 存在
                <br>
                3. GitHub Pages 已完成部署

            </div>

        `;

    }

}


/* =========================================================
   啟動
========================================================= */

loadData();

</script>

</body>
</html>
